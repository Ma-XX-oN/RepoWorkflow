name: RWF109 corrected test imports four-way optimized native CI
on:
  push:
    branches: [issue-109-ci-performance-deduplicate-imported-tests-20261031]
    paths: [.github/workflows/issue-109-dedup-sharded-native.yml]
permissions:
  contents: read
jobs:
  balanced:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        shard: [1, 2, 3, 4]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Ma-XX-oN/RepoWorkflow
          ref: bb55cb853f81670689d5b1fad9163caca7fa21e3
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run exact source with preserved independent tests
        shell: bash
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = bb55cb853f81670689d5b1fad9163caca7fa21e3
          python - <<'PY'
          import os, sys, time, unittest
          modules = [
            "tests.test_prelim_ready_v2_prepare",
            "tests.test_prelim_ready_v2_publish",
            "tests.test_prelim_ready_v2_roundtrip",
            "tests.test_prelim_ready_v2_validation",
            "tests.test_prelim_ready_provider_scope",
            "tests.test_prelim_ready_authority",
            "tests.test_prelim_queue",
            "tests.test_prelim_queue_git",
            "tests.test_done_current_policy",
            "tests.test_done_ready_scheduler",
            "tests.test_done_policy_admission",
            "tests.test_integration_admission",
            "tests.test_prelim_integration_ready",
            "tests.test_prelim_attempt",
          ]
          def flatten(suite):
            for test in suite:
              if isinstance(test, unittest.TestSuite):
                yield from flatten(test)
              else:
                yield test
          all_tests = list(flatten(unittest.defaultTestLoader.loadTestsFromNames(modules)))
          assert len(all_tests) == 111, len(all_tests)
          shard=int(os.environ["SHARD"])
          selected=[
            case for index,case in enumerate(all_tests)
            if index % 4 == shard-1
          ]
          begin=time.perf_counter()
          result=unittest.TextTestRunner(verbosity=0).run(unittest.TestSuite(selected))
          print("RWF109_BALANCED shard=%d tests=%d seconds=%.6f pass=%s" %
            (shard,result.testsRun,time.perf_counter()-begin,result.wasSuccessful()),flush=True)
          assert result.testsRun == len(selected)
          sys.exit(0 if result.wasSuccessful() else 1)
          PY
