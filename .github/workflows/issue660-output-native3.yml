name: RWF 660 Output Boundary Portable Acceptance
on:
  push:
    branches: ['issue-660-output-enforcement-native3-20261105']
    paths: ['.ci/660-output-native3-trigger']
permissions:
  contents: read
jobs:
  registered:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fc13257a9ac780cfd0d998e8c560b3f5a66ed0cf
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt
      - name: Run registered output and portability tests
        run: python scripts/validate-issue.py --groups issue-660-utf8-output-enforcement issue-727-windows-unicode-output issue-736-process-boundary
