name: RWF 660 Capture Invariant Fast
on:
  push:
    branches: ['issue-660-output-capture-fast-20261105']
    paths: ['.ci/660-capture-fast-trigger']
permissions:
  contents: read
jobs:
  invariant:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c98ace6870e9ded665741d9a3aa5f9862b80c445
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt
      - run: python scripts/validate-issue.py --groups issue-660-utf8-output-enforcement
