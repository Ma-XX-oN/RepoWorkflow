name: Issue 677 frozen exact-head certification
on:
  push:
    branches:
      - issue-677-frozen-certification-20261017-a
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt
      - run: |
          python -m unittest \
            tests.test_ticket_admission \
            tests.test_prelim_queue \
            tests.test_prelim_queue_git \
            tests.test_integration_admission \
            tests.test_integration_coordination \
            tests.test_integration_host_v2 \
            tests.test_integration_host_v2_entrypoint \
            tests.test_github_integration_provider \
            tests.test_integration_host_git_cas \
            tests.test_prelim_ready \
            tests.test_prelim_ready_git \
            tests.test_prelim_retirement \
            tests.test_prelim_retirement_evidence \
            tests.test_prelim_retirement_github \
            tests.test_prelim_retirement_remote \
            tests.test_done_executor
  full-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests
