name: RWF 109 assembled provider-v2 exact source native matrix
on:
  push:
    branches:
      - 'issue-109-provider-v2-convergence-20261030'
permissions:
  contents: read
jobs:
  provider-contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 9e2d350a68bbfb2647c527395ee8b1f682ada5b0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Assert source identity
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "9e2d350a68bbfb2647c527395ee8b1f682ada5b0"
          python -V
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile all imported production and test sources
        run: python -m compileall -q adapters repo_workflow tests
      - name: Run unmodified owner + imported provider suites
        run: python -m unittest tests.test_done_cli tests.test_done_runtime tests.test_done_provider_pipeline tests.test_done_shared_lifecycle tests.test_integration_host_v2 tests.test_integration_host_v2_entrypoint tests.test_github_integration_provider tests.test_integration_acceptance_intent tests.test_integration_destination_accept_github tests.test_integration_destination_github tests.test_integration_evidence_external tests.test_integration_host_git_cas tests.test_integration_lease_github tests.test_integration_retirement_github tests.test_integration_terminal_github tests.test_repo_host_github_integration_mit -v
