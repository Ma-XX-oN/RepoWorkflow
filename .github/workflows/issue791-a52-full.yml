name: RWF 791 a52 full regression three native OS
on:
  push:
    branches:
      - issue-791-a52-native-full-20261104
    paths:
      - .ci/issue791-a52-native-trigger
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 95
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a52c7c98d53f03ac259d8c6cd8387712cc244409
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Prepare exact source and runtime
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = a52c7c98d53f03ac259d8c6cd8387712cc244409
          python -m pip install -r requirements.txt
          git switch -c issue-791-a52-test
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Run full registered regression
        shell: bash
        run: ./rwf test regression
