name: "RWF #109 comprehensive assembled executor verification 2026-10-23"
on:
  push:
    branches:
      - issue-109-assembled-executor-verify-20261023t0748
    paths:
      - .github/workflows/issue-109-assembled-executor-verify-20261023.yml
permissions:
  contents: read
jobs:
  original-executor:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 22
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Source and Python identity
        run: python -c "import platform,sys; print(platform.platform(), sys.executable, sys.version)"
      - name: Exact current assembly source
        run: git rev-parse HEAD^
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Direct shared Python CLI root help
        run: python repo_workflow.py --help
      - name: All 38 issue-109-owned test modules (nonproduction)
        run: >-
          python -m unittest -v tests.test_done_canonical_lifecycle tests.test_done_cas_git tests.test_done_check_issuer tests.test_done_cli tests.test_done_completion tests.test_done_current_policy tests.test_done_evidence_promotion tests.test_done_evidence_provider tests.test_done_executor tests.test_done_failed_attempt tests.test_done_failure_handoff tests.test_done_host_coordinator tests.test_done_hosted_stage_pipeline tests.test_done_int_workspace tests.test_done_landed_results tests.test_done_lifecycle_binding tests.test_done_mit_defer_v2 tests.test_done_policy_admission tests.test_done_promotion_provider tests.test_done_provider_acceptance tests.test_done_provider_pipeline tests.test_done_queue_cycle tests.test_done_queue_scheduler tests.test_done_ready_scheduler tests.test_done_results_discovery tests.test_done_retirement_bridge tests.test_done_runtime tests.test_done_shared_lifecycle tests.test_done_source_identity tests.test_done_stage_certification tests.test_done_stage_hosted tests.test_done_terminal_v2 tests.test_engine_remote tests.test_integration_admission tests.test_integration_coordination tests.test_prelim_queue tests.test_prelim_queue_git tests.test_ticket_admission