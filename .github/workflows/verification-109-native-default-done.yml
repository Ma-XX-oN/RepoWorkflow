name: RWF 109 exact-source native DONE acceptance probe
on:
  push:
    branches:
      - verification-109-native-default-done-20261030
permissions:
  contents: read
jobs:
  done-native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 95e5a55d7d9bb16d93a98e517c48e59b43589913
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Assert exact tested source
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "95e5a55d7d9bb16d93a98e517c48e59b43589913"
          python -V
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Existing focused DONE integration behavior
        run: python -m unittest tests.test_done_cli tests.test_done_runtime tests.test_done_provider_pipeline tests.test_done_shared_lifecycle -v
      - name: Verify production public dispatch supplies trusted DONE implementation
        shell: bash
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          module = ast.parse(Path("repo_workflow.py").read_text(encoding="utf-8"))
          calls = [node for node in ast.walk(module) if isinstance(node, ast.Call) and isinstance(node.func, ast.Name) and node.func.id == "handle_public"]
          assert len(calls) == 1, f"expected one production dispatch, got {len(calls)}"
          assert any(item.arg == "done_executor" for item in calls[0].keywords), "RED: native rwf done route supplies no trusted executor"
          PY
