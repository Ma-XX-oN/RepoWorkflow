name: "RWF #109 exact-HEAD executor diagnostics 2026-10-23"
on:
  push:
    branches:
      - issue-109-exact-head-verification-20261023t0743
    paths:
      - .github/workflows/issue-109-exact-head-verification-20261023.yml

permissions:
  contents: read

jobs:
  executor-contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Source identity
        run: git rev-parse HEAD
      - name: Runtime and available shell identity
        run: python -c "import platform,shutil,sys; print('python_executable',sys.executable,'python_version',sys.version,'platform',platform.platform(),'bash',shutil.which('bash'))"
      - name: Install existing dependencies
        run: python -m pip install -r requirements.txt
      - name: Existing Python CLI root help smoke
        run: python repo_workflow.py --help
      - name: Original #109 executor tests (real code, test fixtures; NOT external provider issuer)
        run: >-
          python -m unittest -v
          tests.test_done_runtime
          tests.test_done_cli
          tests.test_done_provider_pipeline
          tests.test_done_stage_certification
          tests.test_done_evidence_promotion
          tests.test_done_results_discovery
          tests.test_done_host_coordinator
          tests.test_done_policy_admission
          tests.test_done_executor
          tests.test_done_current_policy
          tests.test_done_failed_attempt
          tests.test_done_ready_scheduler
          tests.test_done_queue_scheduler
          tests.test_done_mit_defer_v2
          tests.test_engine_remote
