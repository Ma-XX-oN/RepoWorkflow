name: Verify #790 corrective exact-source native
on:
  push:
    branches: [verify-790-corrective-native-20261103]
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d97a95a9957cd10098d1befdcff9435ec7f542ca
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt
      - name: Run registered #790 and first-use regressions on exact source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 'd97a95a9957cd10098d1befdcff9435ec7f542ca'
          python -m py_compile repo_workflow/remote_status.py repo_workflow/public_cli.py tests/test_remote_status_790.py
          python - <<'PY'
          import json
          import subprocess
          import sys
          from pathlib import Path
          catalog = json.loads(Path(".ci/tests.json").read_text(encoding="utf-8"))
          for group in ("issue-790-remote-status", "issue-543-first-use-owner"):
            entry = next(x for x in catalog["tests"] if group in x)
            assert entry[group]["type"] == "regression"
            target = entry[group]["name"]
            print(f"RUN {group}: {target}", flush=True)
            if subprocess.call([sys.executable, "-m", "unittest", target]):
              raise SystemExit(1)
          PY
