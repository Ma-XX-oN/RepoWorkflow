name: RWF 660 Combined Catalogue Native Probe

on:
  push:
    branches: ['issue-660-speculative-catalogue-matrix-20261105']
    paths: ['.ci/rwf660-combined-trigger']

permissions:
  contents: read

jobs:
  catalogue:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ed873a47f6e53f8a9726023091a6ebed7dd49064
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt
      - name: Catalogue-only nonrecursive 110-group probe
        shell: bash
        run: |
          python - <<'PY'
          import json
          import platform
          from pathlib import Path
          import subprocess
          import sys
          import time

          from repo_workflow.self_ci import group_command
          from repo_workflow.test_catalogue import load_test_catalogue

          sha = "ed873a47f6e53f8a9726023091a6ebed7dd49064"
          root = Path.cwd()
          actual = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          assert actual == sha, (actual, sha)
          groups = set(load_test_catalogue(root).groups)
          excluded = {"issue-583-authoritative-validate"}
          assert excluded <= groups
          selected = sorted(groups - excluded)
          assert len(selected) == 110, (len(selected), len(groups))
          print(f"SHA={sha} PLATFORM={platform.system()} SELECTED={len(selected)} EXCLUDED={sorted(excluded)}", flush=True)
          records = []
          for group in selected:
            command = group_command(root, group)
            start = time.monotonic()
            try:
              result = subprocess.run(command, cwd=root, capture_output=True, check=False)
              code = result.returncode
              stdout = result.stdout.decode("utf-8", errors="strict")
              stderr = result.stderr.decode("utf-8", errors="strict")
            except (OSError, UnicodeError) as error:
              code, stdout, stderr = 125, "", str(error)
            elapsed = round(time.monotonic()-start, 3)
            records.append({"group":group,"exit":code,"seconds":elapsed})
            print(f"GROUP {group} EXIT={code} SECONDS={elapsed}", flush=True)
            if code:
              print("STDOUT "+stdout[-8000:], flush=True)
              print("STDERR "+stderr[-12000:], flush=True)
          report = {
            "candidate_sha": sha,
            "platform": platform.system(),
            "selected": len(selected),
            "excluded": sorted(excluded),
            "passed": sum(x["exit"] == 0 for x in records),
            "failed": sum(x["exit"] != 0 for x in records),
            "results": records,
          }
          Path("rwf660-combined-catalogue.json").write_text(
            json.dumps(report,indent=2)+"\n",encoding="utf-8",
          )
          print("FINAL "+json.dumps({k:v for k,v in report.items() if k!="results"}),flush=True)
          sys.exit(1 if report["failed"] else 0)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rwf660-combined-${{ matrix.os }}
          path: rwf660-combined-catalogue.json
          if-no-files-found: warn
          retention-days: 30
