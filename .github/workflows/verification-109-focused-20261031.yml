name: RWF109 current exact-source focused three-OS certification
on:
  push:
    branches:
      - verification-109-runner-workbench-20261031
    paths:
      - .ci/verification-109-focused
permissions:
  contents: read
jobs:
  focused:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ce48f9f1e796e579ddfe4fd92d91913859992da4
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Assert source commit identity
        shell: bash
        run: test "$(git rev-parse HEAD)" = "ce48f9f1e796e579ddfe4fd92d91913859992da4"
      - name: Install declared dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile changed source and focused tests
        run: python -m py_compile repo_workflow/ci_invocation.py repo_workflow/done_cli.py repo_workflow/done_runtime.py tests/test_ci_invocation.py tests/test_ci_invocation_trigger_contract.py tests/test_done_cli.py tests/test_done_runtime.py
      - name: Exact-source isolated native functional regression
        run: python -m unittest tests.test_done_cli tests.test_done_runtime tests.test_ci_invocation tests.test_ci_invocation_trigger_contract -v
