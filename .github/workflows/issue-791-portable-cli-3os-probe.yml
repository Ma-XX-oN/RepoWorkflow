name: RWF 791 accepted portable CLI import three-OS focused test
on:
  push:
    branches:
      - issue-791-portable-cli-accepted-import-20261104
    paths:
      - .github/workflows/issue-791-portable-cli-3os-probe.yml
permissions:
  contents: read
jobs:
  focused:
    name: focused (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 929fbbe1e00251c39c7191e6822c36c37f5d802f
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install requirements
        shell: bash
        run: python -m pip install -r requirements.txt
      - name: Verify exact source and five methods without skips
        shell: bash
        env:
          EXPECTED_SOURCE: 929fbbe1e00251c39c7191e6822c36c37f5d802f
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python - <<'PY'
          import os
          import subprocess
          import sys
          import unittest
          actual = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          assert actual == os.environ["EXPECTED_SOURCE"], (actual, os.environ["EXPECTED_SOURCE"])
          suite = unittest.defaultTestLoader.loadTestsFromName("tests.test_issue629_cli_acceptance")
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          print("source=%s platform=%s run=%s fail=%s errors=%s skips=%s" %
                (actual, sys.platform, result.testsRun, len(result.failures), len(result.errors), len(result.skipped)))
          assert result.testsRun == 5, "all five methods must execute"
          assert not result.failures and not result.errors and not result.skipped
          PY
