name: RWF 757 exact-source PRELIM longpaths native
on:
  push:
    branches: [issue-715-residual-leaves-native-v3-20261023]
    paths: [.github/workflows/issue-757-prelim-longpaths-native.yml]
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  prelim:
    name: "P17 PRELIM / ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b051a30b2333afb6fc2679865c9a772499e8a7f0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Assert exact source
        shell: bash
        run: |
          python - <<'PY'
          import platform, subprocess, sys
          expected = 'b051a30b2333afb6fc2679865c9a772499e8a7f0'
          actual = subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip()
          print('EXACT_SOURCE_SHA='+actual, 'NATIVE_PLATFORM='+platform.platform(), 'INTERPRETER='+sys.executable, flush=True)
          assert actual == expected
          PY
      - name: Install requirements
        run: python -m pip install -r requirements.txt
      - name: Python parse validation
        run: python -m py_compile repo_workflow/prelim_publication.py
      - name: Run genuine provider/PRELIM suites, no waiver
        id: suite
        shell: bash
        run: |
          set -o pipefail
          python -m unittest -v tests.test_prelim_integration tests.test_prelim_validation 2>&1 | tee p17-native-results.log
      - name: Preserve full test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rwf757-p17-${{ matrix.os }}-b051a30b
          path: p17-native-results.log
          if-no-files-found: warn
          retention-days: 30
      - name: Report result to P17 ticket
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          OS: ${{ matrix.os }}
          OUTCOME: ${{ steps.suite.outcome }}
          RUN_ID: ${{ github.run_id }}
        run: |
          body="P17 native source-bound test: os=$OS sha=b051a30b2333afb6fc2679865c9a772499e8a7f0 outcome=$OUTCOME run=https://github.com/$GH_REPO/actions/runs/$RUN_ID. Read actual logs/artifacts before acceptance."
          gh api "repos/$GH_REPO/issues/757/comments" -f "body=$body"
