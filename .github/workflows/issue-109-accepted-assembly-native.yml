name: RWF 109 explicit exact-candidate full native convergence
on:
  push:
    branches:
      - 'issue-109-accepted-assembly-20261030'
    paths:
      - '.ci/run'
permissions:
  contents: read
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      tested_sha: ${{ steps.request.outputs.tested_sha }}
      stage: ${{ steps.request.outputs.stage }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify dedicated invocation and resolve exact source
        id: request
        shell: bash
        run: |
          set -euo pipefail
          python scripts/on-demand-ci-plan.py > plan.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          plan = json.loads(Path("plan.json").read_text(encoding="utf-8"))
          assert plan["stage"] in {"RED-testing", "temp-testing", "GREEN-testing", "regression-testing", "integration-testing"}
          source = plan["tested_sha"]
          assert len(source) == 40 and all(c in "0123456789abcdef" for c in source)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
            out.write("tested_sha=" + source + "\n")
            out.write("stage=" + plan["stage"] + "\n")
          PY
  native-stage:
    needs: plan
    # Supplemental operating-system coverage only. Authoritative PASS requires
    # RepoWorkflow On-Demand CI publisher and exact-source remote readback.
    if: needs.plan.outputs.stage == 'regression-testing' || needs.plan.outputs.stage == 'integration-testing'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.tested_sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify exact requested candidate
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ needs.plan.outputs.tested_sha }}"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify native stage using RWF catalogue-based engine
        shell: bash
        run: |
          set -euo pipefail
          case '${{ needs.plan.outputs.stage }}' in
            regression-testing)
              python scripts/validate.py regression
              ;;
            integration-testing)
              python scripts/validate.py integration
              python scripts/probe-argv-limits.py
              python scripts/probe-graph-renderer.py
              python scripts/probe-ticket-merge.py
              ;;
            *)
              echo 'unsupported native stage' >&2
              exit 1
              ;;
          esac
