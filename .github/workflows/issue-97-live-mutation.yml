name: Issue 97 isolated live mutation acceptance

on:
  push:
    branches:
      - issue-97-github-host-mutation-adapter
    paths:
      - '.github/workflows/issue-97-live-mutation.yml'
      - 'scripts/probe-repo-host-github.py'
      - 'scripts/issue-97-live-trigger.txt'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: issue-97-isolated-live-mutation
  cancel-in-progress: false

jobs:
  live-mutation:
    if: >-
      github.repository == 'Ma-XX-oN/RepoWorkflow' &&
      vars.RWF97_ENABLE == 'true' &&
      vars.RWF97_APPROVED_SHA != '' &&
      vars.RWF97_APPROVED_SHA == github.sha
    environment: rwf97-sandbox
    runs-on: [self-hosted, linux, rwf97-trusted]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify exact independently approved test candidate
        shell: bash
        env:
          APPROVED_SHA: ${{ vars.RWF97_APPROVED_SHA }}
          RUN_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "${#APPROVED_SHA}" -eq 40
          test "$APPROVED_SHA" = "$RUN_SHA"
          test "$(git rev-parse HEAD)" = "$APPROVED_SHA"
      - name: Verify independent environment review protections
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/probe-repo-host-github-environment.py
      - name: Require protected sandbox authority
        shell: bash
        env:
          SANDBOX_REPOSITORY: ${{ vars.RWF97_SANDBOX_REPOSITORY }}
          SANDBOX_ISSUE: ${{ vars.RWF97_SANDBOX_ISSUE }}
          SOURCE_REF: ${{ vars.RWF97_SANDBOX_SOURCE_REF }}
          TARGET_REF: ${{ vars.RWF97_SANDBOX_TARGET_REF }}
          AUTH_EXECUTABLE: ${{ vars.RWF97_AUTH_EXECUTABLE }}
          AUTH_SHA256: ${{ vars.RWF97_AUTH_SHA256 }}
          SANDBOX_TOKEN: ${{ secrets.RWF97_SANDBOX_GH_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$SANDBOX_TOKEN"
          command -v gh >/dev/null
          test -n "$AUTH_EXECUTABLE"
          test -x "$AUTH_EXECUTABLE"
          test -n "$SANDBOX_REPOSITORY"
          test "$SANDBOX_REPOSITORY" != "Ma-XX-oN/RepoWorkflow"
          test -n "$SANDBOX_ISSUE"
          test -n "$SOURCE_REF"
          test -n "$TARGET_REF"
          python - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          import re
          configured = Path(os.environ["AUTH_EXECUTABLE"])
          target = configured.resolve()
          workspace = Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          if not configured.is_absolute() or target == workspace:
            raise SystemExit("trusted verifier cannot be PR checkout")
          if workspace in target.parents:
            raise SystemExit("trusted verifier cannot be PR checkout")
          expected = os.environ["AUTH_SHA256"]
          if not re.fullmatch(r"[0-9a-f]{64}", expected):
            raise SystemExit("trusted verifier digest not pinned")
          observed = hashlib.sha256(target.read_bytes()).hexdigest()
          if observed != expected:
            raise SystemExit("trusted verifier digest mismatch")
          if target.stat().st_uid == os.getuid() or os.access(
            target, os.W_OK
          ):
            raise SystemExit("runner can modify trusted verifier")
          print("protected external verifier identity validated")
          PY
      - name: Run shipped adapter against disposable sandbox only
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RWF97_SANDBOX_GH_TOKEN }}
          SANDBOX_REPOSITORY: ${{ vars.RWF97_SANDBOX_REPOSITORY }}
          SANDBOX_ISSUE: ${{ vars.RWF97_SANDBOX_ISSUE }}
          SOURCE_REF: ${{ vars.RWF97_SANDBOX_SOURCE_REF }}
          TARGET_REF: ${{ vars.RWF97_SANDBOX_TARGET_REF }}
          AUTH_EXECUTABLE: ${{ vars.RWF97_AUTH_EXECUTABLE }}
        run: |
          set -euo pipefail
          export RWF_REPO_HOST_AUTH_COMMAND
          RWF_REPO_HOST_AUTH_COMMAND="$(python - <<'PY'
          import json
          import os
          print(json.dumps([os.environ["AUTH_EXECUTABLE"]]))
          PY
          )"
          python scripts/probe-repo-host-github.py \
            --repository "$SANDBOX_REPOSITORY" \
            --sandbox-issue "$SANDBOX_ISSUE" \
            --source-ref "$SOURCE_REF" \
            --target-ref "$TARGET_REF" \
            --run-id "rwf97-${{ github.run_id }}-${{ github.run_attempt }}"
