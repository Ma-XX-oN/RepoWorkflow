name: RWF 660 Catalogue Focused Native Acceptance
on:
  push:
    branches: ['issue-660-focused-catalogue-workbench-20261105']
    paths: ['.ci/rwf660-focused-trigger']
permissions:
  contents: read
jobs:
  focused:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 07d0ae320a170d2fd7cd798aa20072c05d030d5b
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt
      - name: Execute exact registered test groups
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import platform
          import subprocess
          import sys
          import time
          from repo_workflow.test_catalogue import load_test_catalogue
          from repo_workflow.self_ci import group_command
          expected = "07d0ae320a170d2fd7cd798aa20072c05d030d5b"
          assert subprocess.check_output(
            ["git", "rev-parse", "HEAD"], text=True,
          ).strip() == expected
          groups = (
            "issue-543-shared-hosted-cache",
            "issue-660-high-risk-remote-completion",
            "issue-660-workspace-remote-completion",
          )
          catalogue = load_test_catalogue(Path.cwd())
          assert set(groups) <= set(catalogue.groups)
          records = []
          for group in groups:
            started = time.monotonic()
            command = group_command(Path.cwd(), group)
            result = subprocess.run(command, capture_output=True, check=False)
            output = result.stdout.decode("utf-8", "strict") + result.stderr.decode("utf-8", "strict")
            seconds = round(time.monotonic() - started, 3)
            print(f"GROUP {group} EXIT={result.returncode} SECONDS={seconds}", flush=True)
            print(output[-12000:], flush=True)
            records.append({"group": group, "exit": result.returncode, "seconds": seconds})
          payload = {"source_sha": expected, "os": platform.system(), "results": records}
          Path("rwf660-focused-results.json").write_text(
            json.dumps(payload, indent=2)+"\n", encoding="utf-8",
          )
          print("FINAL "+json.dumps(payload), flush=True)
          sys.exit(int(any(x["exit"] != 0 for x in records)))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rwf660-focused-${{ matrix.os }}
          path: rwf660-focused-results.json
          if-no-files-found: warn
          retention-days: 30
