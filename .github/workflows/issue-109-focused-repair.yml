name: Issue 109 focused manual integration repair
on:
  push:
    branches: [issue-109-consumer-integration-adapter-20261031]
    paths: [.ci/issue-109-focused-repair]
permissions:
  contents: read
jobs:
  focused:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m py_compile tests/test_manual_test_cli.py repo_workflow/test_consumer_integration.py
      - run: python -m unittest -v tests.test_manual_test_cli tests.test_consumer_integration_adapter tests.test_engine_remote
