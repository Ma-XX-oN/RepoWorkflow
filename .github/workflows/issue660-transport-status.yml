name: RWF 660 CMD transport and status Unicode GREEN
on:
  push:
    branches: ['issue-660-transport-status-unicode-focused-20261107']
    paths: ['.github/workflows/issue660-transport-status.yml']
permissions:
  contents: read
jobs:
  catalogue:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2ed6280beb2ef3c2da38270c3c2b5aadf6519279
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt
      - name: Existing registered CMD transport and status catalogue groups
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '2ed6280beb2ef3c2da38270c3c2b5aadf6519279'
          python - <<'PY'
          import subprocess
          from pathlib import Path
          from repo_workflow.self_ci import group_command
          from repo_workflow.test_catalogue import load_test_catalogue
          root = Path.cwd()
          groups = ("issue-787-cmd-transport", "issue-790-remote-status")
          registered = load_test_catalogue(root).groups
          assert all(group in registered for group in groups)
          bad = []
          for group in groups:
            result = subprocess.run(group_command(root, group), cwd=root)
            print(f"REGISTERED_GROUP_OUTCOME {group} {result.returncode}", flush=True)
            if result.returncode:
              bad.append(group)
          print(f"REGISTERED_GROUPS_FAILED {bad}", flush=True)
          raise SystemExit(bool(bad))
          PY
