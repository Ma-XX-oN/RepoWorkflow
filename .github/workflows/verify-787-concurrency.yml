name: Verify #787 concurrent CMD correction
on:
  push:
    branches:
      - verify-787-concurrency-correction-20261103
  pull_request:
    branches:
      - issue-787-cmd-request-transport-20261102

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2e9c3b11f0ffdea632bbb20d14eeb54a49fe2545
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt
      - name: Verify exact source and registered catalogue group
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '2e9c3b11f0ffdea632bbb20d14eeb54a49fe2545'
          python - <<'PY'
          import json
          import subprocess
          import sys
          from pathlib import Path
          data = json.loads(Path(".ci/tests.json").read_text(encoding="utf-8"))
          entry = next(
            (d for d in data["tests"] if "issue-787-cmd-transport" in d),
            None,
          )
          assert entry is not None, "registered issue-787 group missing"
          assert entry["test-harness"] == "unittest"
          target = entry["issue-787-cmd-transport"]["name"]
          print(f"Registered group issue-787-cmd-transport: {target}", flush=True)
          raise SystemExit(subprocess.call([sys.executable, "-m", "unittest", target]))
          PY
