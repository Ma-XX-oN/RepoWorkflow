name: RWF 660 CMD wrapper Unicode origin and refs RED
on:
  push:
    branches: ['issue-660-wrapper-portability-red-20261107']
    paths: ['.github/workflows/issue660-wrapper-portability.yml']
permissions:
  contents: read
jobs:
  registered-wrapper:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ccb3e6b59eb78f75cae2b6a99a0e56024d86e2c1
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt
      - name: Execute existing registered issue-786-cmd-wrapper group
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 'ccb3e6b59eb78f75cae2b6a99a0e56024d86e2c1'
          python - <<'PY'
          from pathlib import Path
          import subprocess
          from repo_workflow.test_catalogue import load_test_catalogue
          from repo_workflow.self_ci import group_command
          root = Path.cwd()
          group = "issue-786-cmd-wrapper"
          assert group in load_test_catalogue(root).groups
          raise SystemExit(subprocess.run(group_command(root,group),cwd=root).returncode)
          PY
