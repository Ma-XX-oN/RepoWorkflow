name: RWF 791 Portability Cherry-pick Native Workbench
on:
  push:
    branches:
      - issue-791-portability-convergence-20261103
    paths:
      - '.ci/issue791-portability-cherrypick-trigger'
permissions:
  contents: read
jobs:
  native-regression:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c920453fbfbd897e4ad25444f0501141ce2cb065
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Prepare pinned exact candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = c920453fbfbd897e4ad25444f0501141ce2cb065
          python -m pip install -r requirements.txt
          git switch -c issue-791-remote-lifecycle-certification-20261103
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python -c 'import platform;print(platform.platform())'
          test "$(git rev-parse HEAD)" = c920453fbfbd897e4ad25444f0501141ce2cb065
      - name: Complete registered regression
        shell: bash
        run: ./rwf test regression
