name: Issue 677 renderer material certification
on:
  push:
    branches:
      - issue-677-renderer-certification-20261017-v1
permissions:
  contents: read
jobs:
  platform-renderer:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt
      - run: python scripts/probe-graph-renderer.py
      - run: python scripts/probe-ticket-merge.py
  graph-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest tests.test_renderer_certification_binding.RendererCertificationBindingTests.test_certification_covers_canonical_graph_and_routing_pipeline
