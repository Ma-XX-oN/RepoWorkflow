name: RWF 660 Shared Process Boundary Native Proof
on:
  push:
    branches: ['issue-660-process-boundary-native-20261105']
    paths: ['.ci/660-process-boundary-trigger']
permissions:
  contents: read
jobs:
  registered:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 511acdd87c1f69f596166caee751feee81249bc4
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt
      - name: Catalogue-registered output/process/hosted-cache tests
        run: python scripts/validate-issue.py --groups issue-660-utf8-output-enforcement issue-736-process-boundary issue-543-github-cache-origin issue-583-ticket-merge-probe
