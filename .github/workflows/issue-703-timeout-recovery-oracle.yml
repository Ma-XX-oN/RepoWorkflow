name: RWF 703 Independent Claimed Timeout Recovery Oracle
on:
  push:
    branches:
      - issue-703-timeout-recovery-tests-20261022t2206
permissions:
  contents: read
jobs:
  recovery-contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify exact assembled product ancestry
        shell: bash
        run: |
          git merge-base --is-ancestor 40a1ff6c9e0392c49f0fe267824e548080f995b4 HEAD
          git diff --name-only 40a1ff6c9e0392c49f0fe267824e548080f995b4 HEAD
      - name: Independent claimed-MIT timeout recovery tests
        shell: bash
        run: |
          set -o pipefail
          python -m unittest tests.test_manual_mit_timeout_recovery tests.test_manual_mit_negative_acceptance tests.test_manual_mit_version_contract -v 2>&1 | tee evidence.txt
      - name: Persist independent oracle output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rwf703-timeout-recovery-${{ matrix.os }}-${{ github.sha }}
          path: evidence.txt
          if-no-files-found: error
