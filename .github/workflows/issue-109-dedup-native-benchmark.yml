name: RWF109 native same-source 155 versus 111 unique test import optimization
on:
  push:
    branches: [issue-109-ci-performance-deduplicate-imported-tests-20261031]
    paths: [.github/workflows/issue-109-dedup-native-benchmark.yml]
permissions:
  contents: read
jobs:
  compare:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        variant: [baseline, optimized]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.variant == 'baseline' && '59b4d62ef2c38a5cd53cfbe03f937c27aedcbc90' || 'bb55cb853f81670689d5b1fad9163caca7fa21e3' }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify exact source and original test identity
        shell: bash
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os,subprocess
          expected={"baseline":"59b4d62ef2c38a5cd53cfbe03f937c27aedcbc90","optimized":"bb55cb853f81670689d5b1fad9163caca7fa21e3"}
          assert subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip()==expected[os.environ["VARIANT"]]
          PY
          python - <<'PY'
          import hashlib,os,sys,time,unittest
          modules=[
            "tests.test_prelim_ready_v2_prepare",
            "tests.test_prelim_ready_v2_publish",
            "tests.test_prelim_ready_v2_roundtrip",
            "tests.test_prelim_ready_v2_validation",
            "tests.test_prelim_ready_provider_scope",
            "tests.test_prelim_ready_authority",
            "tests.test_prelim_queue",
            "tests.test_prelim_queue_git",
            "tests.test_done_current_policy",
            "tests.test_done_ready_scheduler",
            "tests.test_done_policy_admission",
            "tests.test_integration_admission",
            "tests.test_prelim_integration_ready",
          ]
          if os.environ["VARIANT"]=="optimized":
            modules.append("tests.test_prelim_attempt")
          def flatten(suite):
            for x in suite:
              if isinstance(x,unittest.TestSuite):
                yield from flatten(x)
              else:
                yield x
          cases=list(flatten(unittest.defaultTestLoader.loadTestsFromNames(modules)))
          ids=[x.id() for x in cases]
          unique=sorted(set(ids))
          assert len(unique)==111, len(unique)
          assert len(cases)==(155 if os.environ["VARIANT"]=="baseline" else 111),len(cases)
          print("RWF109_IDS count=%d unique=%d sha256=%s" %
            (len(ids),len(unique),hashlib.sha256("\n".join(unique).encode()).hexdigest()),flush=True)
          started=time.perf_counter()
          result=unittest.TextTestRunner(verbosity=0).run(unittest.TestSuite(cases))
          print("RWF109_PERFORMANCE variant=%s tests=%d elapsed=%.6f pass=%s" %
            (os.environ["VARIANT"],result.testsRun,time.perf_counter()-started,result.wasSuccessful()),flush=True)
          sys.exit(0 if result.wasSuccessful() else 1)
          PY
