name: RWF 660 Strict UTF8 Output Native Acceptance
on:
  push:
    branches: ['issue-660-enforce-portable-output-20261105']
    paths: ['.ci/660-output-enforcement-trigger']
permissions:
  contents: read
jobs:
  registered:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ce25f6882ddfcf15d797e679c4388462b30b6589
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt
      - name: Run registered catalogue groups only
        shell: bash
        run: |
          python - <<'PY'
          import json
          import platform
          import subprocess
          import sys
          from pathlib import Path
          from repo_workflow.output import configure_utf8_output
          from repo_workflow.self_ci import group_command
          from repo_workflow.test_catalogue import load_test_catalogue
          if not configure_utf8_output():
            raise SystemExit(2)
          root=Path.cwd()
          sha="ce25f6882ddfcf15d797e679c4388462b30b6589"
          actual=subprocess.check_output(["git","rev-parse","HEAD"]).decode("ascii").strip()
          assert actual==sha, (actual,sha)
          selected=(
            "issue-660-utf8-output-enforcement",
            "issue-727-windows-unicode-output",
            "issue-736-process-boundary",
            "issue-790-remote-status",
          )
          catalogue=load_test_catalogue(root)
          assert set(selected)<=set(catalogue.groups)
          results=[]
          for name in selected:
            completed=subprocess.run(group_command(root,name),cwd=root,capture_output=True,check=False)
            try:
              output=(completed.stdout+completed.stderr).decode("utf-8","strict")
            except UnicodeDecodeError as exc:
              print("non-UTF8 child output "+str(exc),file=sys.stderr,flush=True)
              results.append({"group":name,"exit":125})
              continue
            print("GROUP "+name+" EXIT="+str(completed.returncode),flush=True)
            if completed.returncode:
              print(output[-12000:],flush=True)
            results.append({"group":name,"exit":completed.returncode})
          report={"sha":sha,"os":platform.system(),"results":results}
          Path("rwf660-output-report.json").write_text(json.dumps(report,indent=2)+"\n",encoding="utf-8")
          print("FINAL "+json.dumps(report),flush=True)
          raise SystemExit(int(any(x["exit"] for x in results)))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rwf660-output-${{ matrix.os }}
          path: rwf660-output-report.json
          if-no-files-found: error
          retention-days: 30
