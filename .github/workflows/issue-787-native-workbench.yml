name: RWF 787 Native Catalogue Workbench
on:
  push:
    branches: ['verify-787-native-20261103']
    paths: ['.ci/run']
permissions:
  contents: read
jobs:
  issue-787:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 28b4b4b87945ae6962dfe80fc42ea6abb2561f63
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install declared dependencies
        run: python -m pip install -r requirements.txt
      - name: Run official issue-787 catalogue group on pinned candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '28b4b4b87945ae6962dfe80fc42ea6abb2561f63'
          git switch -c issue-787-cmd-request-transport-20261102
          python - <<'PY'
          import subprocess
          import sys
          from pathlib import Path
          from repo_workflow.self_ci import group_command
          root = Path.cwd()
          command = group_command(root, 'issue-787-cmd-transport')
          print('catalogue group: issue-787-cmd-transport', flush=True)
          print('command:', command, flush=True)
          sys.exit(subprocess.run(command, cwd=root, check=False).returncode)
          PY
