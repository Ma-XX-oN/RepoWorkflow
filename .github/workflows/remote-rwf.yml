name: RepoWorkflow CMD Forwarding

# Separate from .ci/run; this adapter is not an alternate RWF dispatcher.
on:
  push:
    branches:
      - 'CMD-*'
    paths:
      - '.ci/rwf'

permissions:
  contents: read

concurrency:
  group: rwf-cmd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  forward:
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/CMD-') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact CMD request and full history
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Restore authoritative origin refs
        shell: bash
        run: git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*'
      - name: Checkout pinned RWF engine outside consumer workspace
        shell: bash
        env:
          RWF_ENGINE_ROOT: ${{ runner.temp }}/rwf-engine
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/Ma-XX-oN/RepoWorkflow.git "$RWF_ENGINE_ROOT"
          git -C "$RWF_ENGINE_ROOT" checkout --quiet --detach 0b6c8094a5f7cfda5cf9ee60ba61d32cb23b6cb6
          test "$(git -C "$RWF_ENGINE_ROOT" rev-parse HEAD)" = 0b6c8094a5f7cfda5cf9ee60ba61d32cb23b6cb6
          python -m pip install -r "$RWF_ENGINE_ROOT/requirements.txt"
      - name: Forward authenticated CMD argv through normal CLI
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RWF_ENGINE_ROOT: ${{ runner.temp }}/rwf-engine
        run: python "$RWF_ENGINE_ROOT/scripts/hosted-rwf-forward.py"
