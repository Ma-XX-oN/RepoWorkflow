name: RWF 109 exact-source acceptance
on:
  push:
    branches:
      - issue-109-v3-1839-ci
permissions:
  contents: read
  issues: write
jobs:
  focused:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 5273b33564b3546b3cc68834f1359c57913247df
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Exact-source focused acceptance
        run: python -m unittest -v tests.test_done_executor tests.test_done_provider_acceptance tests.test_done_host_coordinator tests.test_done_evidence_promotion tests.test_done_int_workspace tests.test_done_terminal_v2 tests.test_done_retirement_bridge tests.test_done_provider_pipeline
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 5273b33564b3546b3cc68834f1359c57913247df
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install declared runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Full unittest regression
        run: python -m unittest discover -s tests
  report:
    if: always()
    needs: [focused, regression]
    runs-on: ubuntu-latest
    steps:
      - name: Publish exact-source terminal outcomes
        env:
          GH_TOKEN: ${{ github.token }}
          FOCUSED: ${{ needs.focused.result }}
          REGRESSION: ${{ needs.regression.result }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          gh issue comment 109 -R Ma-XX-oN/RepoWorkflow --body "RWF #109 isolated exact-source hosted acceptance. Source: 5273b33564b3546b3cc68834f1359c57913247df. Run: https://github.com/Ma-XX-oN/RepoWorkflow/actions/runs/$RUN_ID. Focused platform matrix: $FOCUSED. Ubuntu full unittest regression: $REGRESSION. This is not end-to-end executor certification or permission to merge."
