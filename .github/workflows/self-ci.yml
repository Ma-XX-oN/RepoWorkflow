name: RepoWorkflow Self CI

on:
  push:
    branches:
      - main
      - issue-1-repoworkflow-foundation
  pull_request:
  workflow_dispatch:
    inputs:
      validation_tier:
        description: Validation tier to run
        required: true
        default: integration
        type: choice
        options:
          - issue
          - regression
          - integration

concurrency:
  group: repoworkflow-self-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  classify:
    runs-on: ubuntu-latest
    outputs:
      validation: ${{ steps.classify.outputs.validation }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Classify changed files
        id: classify
        shell: bash
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            echo "validation=full" >> "$GITHUB_OUTPUT"
            echo '{"class":"default","validation":"full","paths":[]}'
          else
            result="$(python repo_workflow.py classify --base "$base")"
            echo "validation=$(python -c 'import json,sys; print(json.load(sys.stdin)["validation"])' <<<"$result")" >> "$GITHUB_OUTPUT"
            echo "$result"
          fi

  plan:
    needs: classify
    runs-on: ubuntu-latest
    outputs:
      tier: ${{ steps.plan.outputs.tier }}
      groups: ${{ steps.plan.outputs.groups }}
      reason: ${{ steps.plan.outputs.reason }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Select validation tier and groups
        id: plan
        shell: bash
        env:
          REQUESTED_TIER: ${{ github.head_ref == 'issue-583-platform-certification' && 'integration' || (github.event_name == 'workflow_dispatch' && inputs.validation_tier || '') }}
        run: |
          result="$(python scripts/self-ci-plan.py             --event "${{ github.event_name }}"             --ref "${{ github.ref }}"             --head-ref "${{ github.head_ref }}"             --classification "${{ needs.classify.outputs.validation }}"             --requested-tier "$REQUESTED_TIER")"
          echo "$result"
          echo "tier=$(python -c 'import json,sys; print(json.load(sys.stdin)["tier"])' <<<"$result")" >> "$GITHUB_OUTPUT"
          echo "groups=$(python -c 'import json,sys; import json as j; print(j.dumps(json.load(sys.stdin)["groups"], separators=(",",":")))' <<<"$result")" >> "$GITHUB_OUTPUT"
          echo "reason=$(python -c 'import json,sys; print(json.load(sys.stdin)["reason"])' <<<"$result")" >> "$GITHUB_OUTPUT"

  issue-validate:
    needs: [classify, plan]
    if: needs.plan.outputs.tier == 'issue'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install RepoWorkflow runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Run issue-scoped verification
        env:
          RWF_GROUPS: ${{ needs.plan.outputs.groups }}
          RWF_REASON: ${{ needs.plan.outputs.reason }}
        run: |
          echo "tier=issue"
          echo "reason=$RWF_REASON"
          echo "groups=$RWF_GROUPS"
          python scripts/validate-issue.py --groups-json "$RWF_GROUPS"
      - name: Require issue validation to leave repository clean
        shell: bash
        run: |
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

  validate:
    needs: [classify, plan]
    if: needs.plan.outputs.tier == 'regression' || needs.plan.outputs.tier == 'integration'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install RepoWorkflow runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Report selected validation tier
        run: |
          echo "tier=${{ needs.plan.outputs.tier }}"
          echo "reason=${{ needs.plan.outputs.reason }}"
      - name: Run authoritative RepoWorkflow validation
        run: python scripts/validate.py
      - name: Require validation to leave repository clean
        shell: bash
        run: |
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

  argv-limits:
    needs: [classify, plan]
    if: needs.plan.outputs.tier == 'integration'
    name: Probe argv limits (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Probe direct process argument limit
        run: python scripts/probe-argv-limits.py

  graph-renderer-platform:
    needs: [classify, plan]
    if: needs.plan.outputs.tier == 'integration'
    name: Probe graph renderer (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install RepoWorkflow runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Probe constrained graph renderer
        run: python scripts/probe-graph-renderer.py
      - name: Verify six-state glyphs, CSV refresh, and legend integration
        run: python -m unittest tests.test_six_state_integration tests.test_lane_render

  ticket-merge-platform:
    needs: [classify, plan]
    if: needs.plan.outputs.tier == 'integration'
    name: Probe ticket merge (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Probe semantic ticket merge driver
        run: python scripts/probe-ticket-merge.py

  release:
    needs: [classify, plan, issue-validate, validate]
    if: >-
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      (
        needs.plan.outputs.tier == 'docs' ||
        (
          needs.plan.outputs.tier == 'integration' &&
          needs.validate.result == 'success'
        )
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Publish exact stable tag
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < VERSION)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "VERSION is not a plain stable semantic version: $version" >&2
            exit 1
          fi
          head_sha="$(git rev-parse HEAD)"
          remote_head="$(git ls-remote --heads origin refs/heads/main | awk '{print $1}')"
          if [ -z "$remote_head" ] || [ "$remote_head" != "$head_sha" ]; then
            echo "checked-out commit is not the authoritative remote main head" >&2
            exit 1
          fi
          tag="v$version"
          if [ -n "$(git ls-remote --tags origin "refs/tags/$tag")" ]; then
            echo "stable release tag already exists: $tag" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" "$head_sha" -m "$tag"
          git push origin "refs/tags/$tag"
