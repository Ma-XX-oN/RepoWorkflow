name: RWF109 release failure runtime persisted handoff exact-source 3OS
on:
  push:
    branches: [issue-109-release-stage-handoff-fix-20261031]
    paths: [.github/workflows/issue-109-release-stage-handoff-native.yml]
permissions:
  contents: read
jobs:
  service-boundary:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Ma-XX-oN/RepoWorkflow
          ref: 459cadb6269f8d626a3c05c1a76d753f3ed92c18
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Assert accepted exact product SHA and compile
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = 459cadb6269f8d626a3c05c1a76d753f3ed92c18
          python -m compileall -q repo_workflow adapters
      - name: Install declared dependencies
        run: python -m pip install -r requirements.txt
      - name: Current accepted coordinator failure handoff source transport runtime boundary
        shell: bash
        run: |
          python -m unittest -q \
            tests.test_done_queue_cycle \
            tests.test_done_queue_scheduler \
            tests.test_done_failure_handoff \
            tests.test_done_runtime \
            tests.test_done_cli \
            tests.test_done_landed_results \
            tests.test_done_results_discovery \
            tests.test_done_canonical_lifecycle \
            tests.test_done_host_transport \
            tests.test_done_stage_certification \
            tests.test_done_stage_hosted
