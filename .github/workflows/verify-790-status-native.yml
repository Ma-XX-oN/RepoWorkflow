name: Verify #790 native CMD status
on:
  push:
    branches:
      - verify-790-status-native-20261103

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bc7f3e7a63b339e4b8c1a106998cbe43d2de2d8a
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt
      - name: Verify exact source and registered #790 catalogue group
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 'bc7f3e7a63b339e4b8c1a106998cbe43d2de2d8a'
          python - <<'PY'
          import json
          import subprocess
          import sys
          from pathlib import Path
          data = json.loads(Path(".ci/tests.json").read_text(encoding="utf-8"))
          for group in ("issue-790-remote-status", "issue-543-first-use-owner"):
            entry = next((x for x in data["tests"] if group in x), None)
            assert entry is not None, f"registered {group} missing"
            assert entry["test-harness"] == "unittest"
            target = entry[group]["name"]
            print(f"Running registered {group}: {target}", flush=True)
            code = subprocess.call([sys.executable, "-m", "unittest", target])
            if code:
              raise SystemExit(code)
          PY
