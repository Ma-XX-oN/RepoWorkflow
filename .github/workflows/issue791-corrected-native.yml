name: RWF 791 Pinned Corrected Integration Native
on:
  push:
    branches:
      - issue-791-790-native-final-probe-20261103
    paths:
      - .ci/issue791-corrected-native-trigger
permissions:
  contents: read
jobs:
  native-full:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c9373dc65b0bfdebb69023f842e622f51f884d65
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify exact source and environment
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = c9373dc65b0bfdebb69023f842e622f51f884d65
          python -m pip install -r requirements.txt
          python -m compileall -q repo_workflow repo_workflow.py tests
          git switch -c issue-791-remote-lifecycle-certification-20261103
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          test "$(git rev-parse HEAD)" = c9373dc65b0bfdebb69023f842e622f51f884d65
      - name: Registered full public regression
        shell: bash
        run: ./rwf test regression
