name: RWF 791 LEGO Native Exact-Source Regression
on:
  push:
    branches:
      - issue-791-native-*
    paths:
      - .ci/run
permissions:
  contents: read
  actions: read
jobs:
  native-regression:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: f9850887e848868ea658e96a2f6b1800ebabe1ca
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Assert exact accepted-source identity
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "f9850887e848868ea658e96a2f6b1800ebabe1ca"
          python --version
          git --version
      - name: Install declared dependencies
        shell: bash
        run: python -m pip install -r requirements.txt
      - name: Execute official RWF regression catalogue
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$GITHUB_REF_NAME"
          ./rwf test regression
