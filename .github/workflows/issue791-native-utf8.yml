name: RWF 791 Accepted Portability Native Focused Verification
on:
  push:
    branches:
      - issue-791-native-*
    paths:
      - .ci/native-rwf-791
permissions:
  contents: read
  actions: read
jobs:
  native-regression:
    env:
      GH_TOKEN: ${{ github.token }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d0ec9fa175c508d37ce9f0e293e6c3c70ee376d3
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Assert exact accepted-source identity
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "d0ec9fa175c508d37ce9f0e293e6c3c70ee376d3"
          python --version
          git --version
      - name: Install declared dependencies
        shell: bash
        run: python -m pip install -r requirements.txt
      - name: Execute focused accepted launcher tests
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$GITHUB_REF_NAME"
          python -m unittest -v tests.test_remote_invocation_786 tests.test_issue787_remote_request tests.test_issue788_hosted_forward tests.test_remote_result_789 tests.test_remote_status_790 tests.test_test_cli_remote tests.test_ci_invocation_trigger_contract
