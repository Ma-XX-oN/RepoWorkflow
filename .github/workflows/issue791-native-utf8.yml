name: RWF 791 Accepted Portability Native Focused Verification
on:
  push:
    branches:
      - issue-791-native-*
    paths:
      - .ci/native-rwf-791
permissions:
  contents: read
  actions: read
jobs:
  native-regression:
    env:
      GH_TOKEN: ${{ github.token }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 44006f61a0825d681c7470bfc1712a0259b63b2d
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Assert exact accepted-source identity
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "44006f61a0825d681c7470bfc1712a0259b63b2d"
          python --version
          git --version
      - name: Install declared dependencies
        shell: bash
        run: python -m pip install -r requirements.txt
      - name: Execute focused accepted launcher tests
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$GITHUB_REF_NAME"
          python -m unittest -v tests.test_bootstrap_cli tests.test_first_use_lanes_state
