name: RWF 791 Registry Locator Native Diagnostic
on:
  push:
    branches: [issue-791-native-*]
    paths: [.ci/targeted-registry-trigger]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cf135ce15293ab169ba66f28a81e14776fa10bb6
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify acceptance registry and real split methods
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = cf135ce15293ab169ba66f28a81e14776fa10bb6
          python -m pip install -r requirements.txt
          python -m unittest tests.test_first_use_workflows tests.test_lane_diagnostics.LaneDiagnosticsTests.test_timing_accounting_is_internally_consistent tests.test_first_use_lanes.FirstUseGraphTests.test_diagnostic_record_survives_fresh_process_readback tests.test_lane_follow_verification tests.test_lane_show_children_verification
