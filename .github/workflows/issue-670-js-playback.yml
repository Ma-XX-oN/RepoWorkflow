name: Issue 670 JavaScript interface replay

on:
  push:
    branches:
      - issue-670-javascript-interface-playback-v1
    paths:
      - 'testing/javascript/**'
      - 'tests/interface-playback.test.mjs'
      - '.ci/tests.json'
      - '.github/workflows/issue-670-js-playback.yml'
  pull_request:
    paths:
      - 'testing/javascript/**'
      - 'tests/interface-playback.test.mjs'
      - '.ci/tests.json'
      - '.github/workflows/issue-670-js-playback.yml'

permissions:
  contents: read

jobs:
  node22:
    name: Node 22 executable-interface replay
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify source size
        run: |
          test "$(wc -l < testing/javascript/interface-playback.mjs)" -lt 500
      - name: Validate syntax
        run: |
          node --check testing/javascript/interface-playback.mjs
          node --check tests/interface-playback.test.mjs
      - name: Run exact-candidate regression
        run: node --test tests/interface-playback.test.mjs
      - name: Prohibit private capture fixtures
        run: |
          if git ls-files | grep -E '\.(mlog\.zst|har|pcap)$'; then
            echo 'Private capture fixture tracked in candidate' >&2
            exit 1
          fi
