name: RWF 660 Inline Output Contract Native
on:
  push:
    branches: ['issue-660-inline-output-native-20261105']
    paths: ['.ci/660-inline-output-trigger']
permissions:
  contents: read
jobs:
  registered:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 150c3441fcf0221b8a22394dd96aa6d4a27a2d48
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt
      - name: Run registered enforcement and workflow interface tests
        run: python scripts/validate-issue.py --groups issue-660-utf8-output-enforcement issue-736-process-boundary issue-540-on-demand-ci-marker issue-541-hosted-plan-binding issue-543-hosted-publication issue-572-hosted-terminal-binding invariant-ci-invocation-trigger
