name: RWF 660 Output Boundary Acceptance Clean
on:
  push:
    branches: ['issue-660-output-enforcement-native2-20261105']
    paths: ['.ci/660-output-clean-trigger']
permissions:
  contents: read
jobs:
  registered:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 979048a69060a929ccfef2c56709d4d31a43dc3b
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt
      - name: Catalogue-registered groups via repository validator
        run: python scripts/validate-issue.py --groups issue-660-utf8-output-enforcement issue-727-windows-unicode-output issue-736-process-boundary
