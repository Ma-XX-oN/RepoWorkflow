name: RWF 660 Remaining Registered Groups
on:
  push:
    branches: ['issue-660-tail-catalogue-native-20261105']
    paths: ['.ci/660-tail-catalogue-trigger']
permissions:
  contents: read
jobs:
  catalogue-tail:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 3ee0fe00f3275c6c0b436c6cd771aecb23b21237
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt
      - name: Run six remaining catalogue groups via existing registered runner
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "3ee0fe00f3275c6c0b436c6cd771aecb23b21237"
          python scripts/validate-issue.py --groups-json '["issue-583-graph-platform-probe","issue-583-ticket-merge-probe","issue-660-issue-start-version-commit","issue-660-high-risk-remote-completion","issue-660-workspace-remote-completion","issue-787-cmd-transport"]'
