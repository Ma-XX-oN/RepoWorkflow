name: RepoWorkflow Consumer CI

on:
  workflow_call:
    inputs:
      event_name:
        required: true
        type: string
      branch:
        required: true
        type: string
      pr_base:
        required: false
        type: string
        default: ''
      head_sha:
        required: true
        type: string

permissions:
  contents: read

jobs:
  policy:
    runs-on: ubuntu-latest
    env:
      RWF_REPO_CI_WORKSPACE: ${{ github.workspace }}
      RWF_CI_BASE_SHA: ${{ inputs.head_sha }}
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
      matrix: ${{ steps.matrix.outputs.matrix }}
      prepare_context: ${{ steps.prepare-context.outputs.context }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.head_sha }}
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Enforce repository automation policy
        run: python RepoWorkflow/repo_workflow.py repository-policy
      - name: Enforce branch policy
        run: >-
          python RepoWorkflow/repo_workflow.py branch-policy
          --branch "${{ inputs.branch }}"
          --pr-base "${{ inputs.pr_base }}"
      - name: Resolve authoritative workflow mode
        id: mode
        shell: bash
        run: >-
          echo "mode=$(python RepoWorkflow/repo_workflow/repo_ci_github_machine.py mode
          --event-name '${{ inputs.event_name }}'
          --event-path "$GITHUB_EVENT_PATH"
          --branch '${{ inputs.branch }}')" >> "$GITHUB_OUTPUT"
      - name: Resolve artifact-preparation context
        id: prepare-context
        shell: bash
        run: >-
          echo "context=$(python RepoWorkflow/repo_workflow/repo_ci_github_machine.py prepare-context)"
          >> "$GITHUB_OUTPUT"
      - name: Load GitHub validation matrix
        if: steps.mode.outputs.mode != 'none'
        id: matrix
        shell: bash
        run: >-
          echo "matrix=$(python RepoWorkflow/repo_workflow/repo_ci_github_machine.py matrix)"
          >> "$GITHUB_OUTPUT"

  prepare:
    needs: policy
    if: needs.policy.outputs.mode != 'none'
    runs-on: ${{ fromJSON(needs.policy.outputs.prepare_context).runner }}
    permissions:
      contents: write
    outputs:
      tested_sha: ${{ steps.prepare.outputs.tested_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.head_sha }}
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ fromJSON(needs.policy.outputs.prepare_context).pythonVersion }}
      - uses: actions/setup-dotnet@v4
        if: fromJSON(needs.policy.outputs.prepare_context).dotnetVersion != ''
        with:
          dotnet-version: ${{ fromJSON(needs.policy.outputs.prepare_context).dotnetVersion }}
      - uses: actions/setup-node@v4
        if: fromJSON(needs.policy.outputs.prepare_context).nodeVersion != ''
        with:
          node-version: ${{ fromJSON(needs.policy.outputs.prepare_context).nodeVersion }}
      - name: Verify requested candidate
        shell: bash
        run: |
          if [ "${{ needs.policy.outputs.mode }}" = "stable" ]; then
            python RepoWorkflow/repo_workflow.py stable-preflight \
              --expected-sha "${{ inputs.head_sha }}"
          else
            python RepoWorkflow/repo_workflow.py preflight \
              --expected-sha "${{ inputs.head_sha }}"
          fi
      - name: Configure generated-artifact commit identity
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Materialize declared committed artifacts
        id: prepare
        shell: bash
        run: |
          before="$(git rev-parse HEAD)"
          mkdir -p "${{ runner.temp }}/repoworkflow-result"
          set +e
          if [ "${{ needs.policy.outputs.mode }}" = "stable" ]; then
            python RepoWorkflow/repo_workflow.py materialize-artifacts --stable \
              --commit \
              --result "${{ runner.temp }}/repoworkflow-result/artifacts.json"
          else
            python RepoWorkflow/repo_workflow.py materialize-artifacts \
              --commit \
              --result "${{ runner.temp }}/repoworkflow-result/artifacts.json"
          fi
          materialize_rc=$?
          set -e
          after="$(git rev-parse HEAD)"
          if [ "$materialize_rc" -eq 0 ] && [ "$after" != "$before" ]; then
            git push origin "HEAD:${{ inputs.branch }}"
          fi
          echo "tested_sha=$after" >> "$GITHUB_OUTPUT"
      - name: Upload structured artifact-preparation result
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: repoworkflow-result-artifacts
          path: ${{ runner.temp }}/repoworkflow-result/artifacts.json
          if-no-files-found: error

  validate:
    needs:
      - policy
      - prepare
    if: needs.policy.outputs.mode != 'none' && needs.prepare.result == 'success'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.policy.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tested_sha }}
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.pythonVersion }}
      - uses: actions/setup-dotnet@v4
        if: matrix.dotnetVersion != ''
        with:
          dotnet-version: ${{ matrix.dotnetVersion }}
      - uses: actions/setup-node@v4
        if: matrix.nodeVersion != ''
        with:
          node-version: ${{ matrix.nodeVersion }}
      - name: Run core validation through configured repo-ci adapter
        id: validation
        continue-on-error: true
        shell: bash
        env:
          RWF_REPO_CI_WORKSPACE: ${{ github.workspace }}
          RWF_REPO_CI_RESULT_ROOT: ${{ runner.temp }}/repoworkflow-result
          RWF_STAGE: ${{ matrix.id }}
          RWF_CANDIDATE: ${{ needs.prepare.outputs.tested_sha }}
          RWF_BASE: ${{ inputs.head_sha }}
          RWF_MODE: ${{ needs.policy.outputs.mode }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys

          result_path = str(Path(os.environ["RWF_REPO_CI_RESULT_ROOT"]) /
                            (os.environ["RWF_STAGE"] + ".json"))
          request = {
            "contract_version": 1,
            "operation": "execute",
            "invocation_id": os.environ["GITHUB_RUN_ID"] + "-" +
                             os.environ["GITHUB_RUN_ATTEMPT"] + "-" +
                             os.environ["RWF_STAGE"],
            "candidate": {
              "repository": os.environ["GITHUB_REPOSITORY"],
              "commit": os.environ["RWF_CANDIDATE"],
              "base": os.environ["RWF_BASE"],
            },
            "requirements": {
              "stages": [os.environ["RWF_STAGE"]],
              "capabilities": [], "artifacts": [],
            },
            "inputs": {
              "consumer_workspace": os.environ["RWF_REPO_CI_WORKSPACE"],
              "result_path": result_path,
              "mode": "stable" if os.environ["RWF_MODE"] == "stable" else "development",
              "base": os.environ["RWF_BASE"],
            },
          }
          process = subprocess.run(
            [sys.executable, "RepoWorkflow/repo_workflow.py", "repo-ci", "execute"],
            input=json.dumps(request), text=True, capture_output=True, check=False,
          )
          if process.stderr:
            print(process.stderr, file=sys.stderr)
          try:
            response = json.loads(process.stdout)
          except ValueError:
            print("repo-ci adapter returned malformed response", file=sys.stderr)
            raise SystemExit(2)
          if process.returncode or response.get("status") != "ok":
            print(json.dumps(response), file=sys.stderr)
            raise SystemExit(2)
          observed = response["observations"]["stages"]
          if len(observed) != 1 or observed[0]["stage"] != os.environ["RWF_STAGE"]:
            print("repo-ci stage identity mismatch", file=sys.stderr)
            raise SystemExit(2)
          print(json.dumps({"stage": observed[0]["stage"],
                            "core_exit_code": observed[0]["core_exit_code"]}))
          PY
      - name: Package exact-bound environment result through repo-ci
        if: always()
        continue-on-error: true
        shell: bash
        env:
          RWF_REPO_CI_WORKSPACE: ${{ github.workspace }}
          RWF_REPO_CI_TRANSPORT_ROOT: ${{ runner.temp }}
          RWF_CANDIDATE: ${{ needs.prepare.outputs.tested_sha }}
          RWF_BASE: ${{ inputs.head_sha }}
        run: >-
          python RepoWorkflow/repo_workflow/repo_ci_github_result_machine.py
          publish --stage "${{ matrix.id }}"
      - name: Upload exact-bound provider result bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repoworkflow-provider-result-${{ matrix.id }}
          path: ${{ runner.temp }}/repoworkflow-provider-bundles/${{ matrix.id }}/
          if-no-files-found: error

  finalize:
    needs:
      - policy
      - prepare
      - validate
    if: always() && needs.policy.outputs.mode != 'none' && needs.prepare.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tested_sha }}
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Prepare result collection directory
        shell: bash
        run: mkdir -p "${{ runner.temp }}/repoworkflow-results"
      - name: Download exact-bound provider result bundles
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: repoworkflow-provider-result-*
          path: ${{ runner.temp }}/downloaded-provider
      - name: Download independent artifact preparation result
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: repoworkflow-result-artifacts
          path: ${{ runner.temp }}/repoworkflow-results
      - name: Verify and materialize required result bundles via repo-ci
        continue-on-error: true
        shell: bash
        env:
          RWF_REPO_CI_WORKSPACE: ${{ github.workspace }}
          RWF_REPO_CI_TRANSPORT_ROOT: ${{ runner.temp }}
          RWF_CANDIDATE: ${{ needs.prepare.outputs.tested_sha }}
          RWF_BASE: ${{ inputs.head_sha }}
          RWF_MATRIX: ${{ needs.policy.outputs.matrix }}
        run: >-
          python RepoWorkflow/repo_workflow/repo_ci_github_result_machine.py
          fetch-all
      - name: Configure result-tag identity
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Finalize authoritative result
        shell: bash
        run: |
          if [ "${{ needs.policy.outputs.mode }}" = "stable" ]; then
            python RepoWorkflow/repo_workflow.py stable-finalize \
              --results-dir "${{ runner.temp }}/repoworkflow-results" \
              --expected-sha "${{ needs.prepare.outputs.tested_sha }}" \
              --tag --push
          else
            python RepoWorkflow/repo_workflow.py finalize \
              --results-dir "${{ runner.temp }}/repoworkflow-results" \
              --expected-sha "${{ needs.prepare.outputs.tested_sha }}" \
              --tag --push
          fi
