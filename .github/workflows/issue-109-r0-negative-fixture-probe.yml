name: "RWF 109 R0 independent negative-fixture compatibility"
on:
  push:
    branches:
      - issue-109-r0-negative-fixture-probe-20261022t1352
permissions:
  contents: read
jobs:
  negative_oracle:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt
      - name: "Independent fixture negative MIT FAIL and TIMEOUT"
        run: python -m unittest -v tests.test_manual_mit_negative_acceptance
