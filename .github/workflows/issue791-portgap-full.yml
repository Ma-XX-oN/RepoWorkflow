name: RWF 791 portgap exact 3OS regression
on:
  push:
    branches:
      - issue-791-portgap-native-full-20261104
    paths:
      - .ci/issue791-portgap-native-trigger
permissions:
  contents: read
jobs:
  native-regression:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 95
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c0cdf26115c1e97c3d2c86e8f505badc2c079b32
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify exact source and setup
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = c0cdf26115c1e97c3d2c86e8f505badc2c079b32
          python -m pip install -r requirements.txt
          git switch -c issue-791-portgap-native-fixture
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Full registered native regression
        shell: bash
        run: ./rwf test regression
