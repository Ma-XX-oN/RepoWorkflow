name: RWF 791 P4 and UTF8 Targeted Native Diagnostic
on:
  push:
    branches: [issue-791-native-*]
    paths: [.ci/targeted-p4-utf8-trigger]
permissions:
  contents: read
jobs:
  diagnose:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 0a769f0a9793b64947edec01ef2615d07afa0bf0
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Exercise registered failing fixture cases and strict stderr negative
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 0a769f0a9793b64947edec01ef2615d07afa0bf0
          python -m pip install -r requirements.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python -m unittest \
            tests.test_first_use_lanes \
            tests.test_first_use_lanes_refresh \
            tests.test_first_use_lanes_provider \
            tests.test_first_use_lanes_state \
            tests.test_remote_result_789
