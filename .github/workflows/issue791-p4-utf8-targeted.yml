name: RWF 791 P4 and UTF8 Targeted Native Diagnostic
on:
  push:
    branches: [issue-791-native-*]
    paths: [.ci/targeted-p4-utf8-trigger]
permissions:
  contents: read
jobs:
  diagnose:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d4115e44025eeb33e3fb5dbf6d232b8e776f2851
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Exercise registered failing fixture cases and strict stderr negative
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = d4115e44025eeb33e3fb5dbf6d232b8e776f2851
          python -m pip install -r requirements.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python -m unittest \
            tests.test_first_use_lanes.FirstUseLanesTests.test_existing_empty_canonical_issue_reconciles_after_provider_migration \
            tests.test_first_use_lanes.FirstUseLanesTests.test_existing_nonempty_dependency_conflict_fails_closed \
            tests.test_first_use_lanes.FirstUseLanesTests.test_repository_manifest_blocks_bootstrap_until_migration_certified \
            tests.test_remote_result_789.ResultFixture.test_failed_git_with_invalid_utf8_stderr_fails_closed
