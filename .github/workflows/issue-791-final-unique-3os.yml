name: RWF 791 unique-version exact-source native regression
on:
  push:
    branches:
      - issue-791-final-unique-version-20261104
    paths:
      - .github/workflows/issue-791-final-unique-3os.yml
permissions:
  contents: read
jobs:
  native-regression:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ce00d568b2454a6b0a873cc6c9a61e8a0fcb2f10
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Assert source SHA
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "ce00d568b2454a6b0a873cc6c9a61e8a0fcb2f10"
          python --version
          git --version
      - name: Install dependencies
        shell: bash
        run: python -m pip install -r requirements.txt
      - name: Execute registered full regression
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$GITHUB_REF_NAME"
          ./rwf test regression
