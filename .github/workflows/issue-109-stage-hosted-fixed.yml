name: RWF 109 exact-source acceptance
on:
  push:
    branches:
      - issue-109-v3-stage-hosted-fixed-20261021
permissions:
  contents: read
  issues: write
jobs:
  focused:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 7abe8460a552afbcd3343dd5b168b3a9d7900074
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Exact-source focused acceptance
        run: python -m unittest -v tests.test_done_executor tests.test_done_provider_acceptance tests.test_done_stage_hosted tests.test_done_hosted_stage_pipeline tests.test_done_check_issuer tests.test_done_source_identity tests.test_done_runtime tests.test_done_cli tests.test_done_promotion_provider tests.test_done_results_discovery tests.test_done_failure_handoff tests.test_done_queue_cycle tests.test_done_queue_scheduler tests.test_done_completion tests.test_done_policy_admission tests.test_done_stage_certification tests.test_done_mit_defer_v2 tests.test_done_evidence_provider tests.test_done_host_coordinator tests.test_done_evidence_promotion tests.test_done_lifecycle_binding tests.test_done_canonical_lifecycle tests.test_done_shared_lifecycle tests.test_done_int_workspace tests.test_done_terminal_v2 tests.test_done_retirement_bridge tests.test_done_provider_pipeline
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 7abe8460a552afbcd3343dd5b168b3a9d7900074
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install declared runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Full unittest regression
        run: python -m unittest discover -s tests
  report:
    if: always()
    needs: [focused, regression]
    runs-on: ubuntu-latest
    steps:
      - name: Publish exact-source terminal outcomes
        env:
          GH_TOKEN: ${{ github.token }}
          FOCUSED: ${{ needs.focused.result }}
          REGRESSION: ${{ needs.regression.result }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          gh issue comment 109 -R Ma-XX-oN/RepoWorkflow --body "RWF #109 isolated exact-source hosted acceptance. Source: 7abe8460a552afbcd3343dd5b168b3a9d7900074. Run: https://github.com/Ma-XX-oN/RepoWorkflow/actions/runs/$RUN_ID. Focused platform matrix: $FOCUSED. Ubuntu full unittest regression: $REGRESSION. This is not end-to-end executor certification or permission to merge."
