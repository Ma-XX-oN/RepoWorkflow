name: RWF 109 provider-v2 assembled full exact-source regression
on:
  push:
    branches:
      - 'issue-109-provider-v2-convergence-20261030'
permissions:
  contents: read
jobs:
  full-regression:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: acb5a5b9b5110833d99933eb1d1a53b3e1e48a89
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Exact immutable assembled source
        shell: bash
        run: test "$(git rev-parse HEAD)" = "acb5a5b9b5110833d99933eb1d1a53b3e1e48a89"
      - name: Install declared requirements
        run: python -m pip install -r requirements.txt
      - name: Full repository unittest discovery
        shell: bash
        run: python -m unittest discover -s tests -p 'test_*.py' -v
