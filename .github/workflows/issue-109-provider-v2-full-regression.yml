name: RWF 109 provider-v2 assembled full exact-source regression
on:
  push:
    branches:
      - 'issue-109-provider-v2-convergence-20261030'
permissions:
  contents: read
jobs:
  full-regression:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 20f0b9edc9473208566e176aff1a6b0360c09303
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Exact immutable assembled source
        shell: bash
        run: test "$(git rev-parse HEAD)" = "20f0b9edc9473208566e176aff1a6b0360c09303"
      - name: Install declared requirements
        run: python -m pip install -r requirements.txt
      - name: Full repository unittest discovery
        shell: bash
        run: python -m unittest discover -s tests -p 'test_*.py' -v
