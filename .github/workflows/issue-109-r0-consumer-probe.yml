name: "RWF 109 R0 consumer compatibility (verification only)"
on:
  push:
    branches:
      - issue-109-r0-consumer-probe-20261022t1318

permissions:
  contents: read

jobs:
  focused:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt
      - name: "R0 consumer and independent version tests"
        run: python -m unittest -v tests.test_engine_remote tests.test_engine_version_adapter tests.test_phase_terminal tests.test_version_adapter tests.test_manual_mit_version_contract

  full:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt
      - name: "Full regression (baseline failures remain real)"
        shell: bash
        run: |
          python scripts/validate.py > full-regression.log 2>&1
          status=$?
          tail -n 100 full-regression.log
          exit "$status"
      - name: "Preserve regression observations"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rwf109-r0-regression-${{ matrix.os }}
          path: full-regression.log
          if-no-files-found: warn
