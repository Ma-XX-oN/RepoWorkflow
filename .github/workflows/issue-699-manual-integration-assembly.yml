name: RWF 699 Manual Integration Controller Assembly
on:
  push:
    branches:
      - issue-699-mit-controller-assembly
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assembled-contract:
    name: Combined MIT contracts (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt
      - name: A+B+C+D+native done tests
        shell: bash
        run: |
          set -o pipefail
          python -m unittest -v \
            tests.test_manual_test_catalogue \
            tests.test_manual_test_result \
            tests.test_manual_test_cli \
            tests.test_manual_mit_negative_acceptance \
            tests.test_manual_self_ci_selection \
            tests.test_done_cli 2>&1 | tee combined-contract-results.txt
      - name: Save combined test observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rwf699-contract-${{ matrix.os }}-${{ github.sha }}
          path: combined-contract-results.txt
          if-no-files-found: warn
          retention-days: 14

  full-regression:
    name: Repository regression (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt
      - name: Full repository regression
        shell: bash
        run: |
          set -o pipefail
          python scripts/validate.py 2>&1 | tee full-regression-results.txt
      - name: Retain regression log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rwf699-regression-${{ matrix.os }}-${{ github.sha }}
          path: full-regression-results.txt
          if-no-files-found: warn
          retention-days: 14

  baseline-regression:
    name: Exact #109 baseline regression (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout exact #109 baseline (not #699 source)
        uses: actions/checkout@v4
        with:
          ref: 66c64e563eae3c93579104c27b476c5121e4b53f
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt
      - name: Capture exact baseline full regression
        shell: bash
        run: |
          set -o pipefail
          git rev-parse HEAD
          python scripts/validate.py 2>&1 | tee baseline-full-regression-results.txt
      - name: Retain #109 baseline observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rwf699-baseline-${{ matrix.os }}-${{ github.sha }}
          path: baseline-full-regression-results.txt
          if-no-files-found: warn
          retention-days: 14
