name: RWF 699 Manual Integration Controller Assembly
on:
  push:
    branches:
      - issue-699-mit-controller-assembly
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assembled-contract:
    name: Combined MIT contracts (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt
      - name: A+B+C+D+native done tests
        shell: bash
        run: |
          set -o pipefail
          python -m unittest -v \
            tests.test_manual_test_catalogue \
            tests.test_manual_test_result \
            tests.test_manual_test_cli \
            tests.test_manual_mit_negative_acceptance \
            tests.test_manual_self_ci_selection \
            tests.test_manual_mit_version_contract \
            tests.test_engine_version_adapter \
            tests.test_version_adapter \
            tests.test_phase_terminal \
            tests.test_workflow_transitions \
            tests.test_engine_remote \
            tests.test_done_cli \
            tests.test_done_executor \
            tests.test_done_runtime \
            tests.test_done_completion \
            tests.test_done_mit_defer_v2 2>&1 | tee combined-contract-results.txt
      - name: Save combined test observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rwf699-contract-${{ matrix.os }}-${{ github.sha }}
          path: combined-contract-results.txt
          if-no-files-found: warn
          retention-days: 14

  full-regression:
    name: Repository regression (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt
      - name: Full repository regression
        shell: bash
        run: |
          set -o pipefail
          python scripts/validate.py 2>&1 | tee full-regression-results.txt
      - name: Retain regression log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rwf699-regression-${{ matrix.os }}-${{ github.sha }}
          path: full-regression-results.txt
          if-no-files-found: warn
          retention-days: 14

  portability-focused:
    name: Portability focused (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt
      - name: Exact assembled portability modules
        shell: bash
        run: |
          set -o pipefail
          python -m unittest -v \
            tests.test_git_protocol_boundary_p10 \
            tests.test_process_boundary_p10 \
            tests.test_config \
            tests.test_retry_evidence \
            tests.test_windows_unicode_output_p9 \
            tests.test_local_terminal_jsonl_p16 \
            tests.test_bootstrap_cli \
            tests.test_first_use_lanes \
            tests.test_first_use_lanes_provider \
            tests.test_first_use_lanes_refresh \
            tests.test_first_use_lanes_state 2>&1 | tee portability-focused-results.txt
      - name: Save portability focused results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rwf699-portability-${{ matrix.os }}-${{ github.sha }}
          path: portability-focused-results.txt
          if-no-files-found: warn
          retention-days: 14
