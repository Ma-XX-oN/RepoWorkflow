name: RWF 710 R1 Oracle Isolated Verification
on:
  push:
    branches:
      - issue-710-verify-r1-oracle-20261022
  workflow_dispatch:

permissions:
  contents: read

jobs:
  oracle-and-focused:
    name: R1 rejection and R0 acceptance (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt
      - name: Independent R0 oracles, R1 negative test, and version suites
        shell: bash
        run: |
          set -o pipefail
          python -m unittest -v \
            tests.test_manual_mit_version_contract \
            tests.test_version_adapter \
            tests.test_engine_version_adapter \
            tests.test_phase_terminal \
            tests.test_engine_remote \
            tests.test_workflow_transitions 2>&1 | tee focused-results.txt
      - name: Real shared-fixture Q+1/R0 and next ART R0-to-R1
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from tempfile import TemporaryDirectory
          from tests.support import RepoFixture
          from repo_workflow.config import load_config
          from repo_workflow.version_adapter import run_transition
          with TemporaryDirectory() as temp:
            root = Path(temp) / "repo"
            root.mkdir()
            RepoFixture(root)
            config = load_config(root)
            first = run_transition(root, config, "task", "--increment", "merge-integration-failed")
            assert first.before == "1.0.0-issue.1.0.1", first
            assert first.after == "1.0.0-issue.1.1.0", first
            next_art = run_transition(root, config, "task", "--increment", "CI-iteration")
            assert next_art.before == "1.0.0-issue.1.1.0", next_art
            assert next_art.after == "1.0.0-issue.1.1.1", next_art
            print("PASS: shared RepoFixture Q+1/R0, then ART R0->R1")
          PY
      - name: Retain focused evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rwf710-r1-focused-${{ matrix.os }}-${{ github.sha }}
          path: focused-results.txt
          if-no-files-found: warn
          retention-days: 14

  combined-contract:
    name: Combined MIT contracts (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt
      - name: MIT native-done contract regression
        shell: bash
        run: |
          set -o pipefail
          python -m unittest -v \
            tests.test_manual_test_catalogue \
            tests.test_manual_test_result \
            tests.test_manual_test_cli \
            tests.test_manual_mit_negative_acceptance \
            tests.test_manual_self_ci_selection \
            tests.test_manual_mit_version_contract \
            tests.test_engine_version_adapter \
            tests.test_version_adapter \
            tests.test_phase_terminal \
            tests.test_workflow_transitions \
            tests.test_done_cli 2>&1 | tee combined-results.txt
      - name: Retain combined contract evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rwf710-r1-combined-${{ matrix.os }}-${{ github.sha }}
          path: combined-results.txt
          if-no-files-found: warn
          retention-days: 14

  full-regression:
    name: Full repository regression (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt
      - name: Complete source-bound repository validation
        shell: bash
        run: |
          set -o pipefail
          python scripts/validate.py 2>&1 | tee full-results.txt
      - name: Retain full regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rwf710-r1-full-${{ matrix.os }}-${{ github.sha }}
          path: full-results.txt
          if-no-files-found: warn
          retention-days: 14
