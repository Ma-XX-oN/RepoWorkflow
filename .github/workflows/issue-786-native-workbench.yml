name: RWF 786 Native Catalogue Workbench
on:
  push:
    branches: ['verify-786-native-20261103']
    paths: ['.ci/run']
permissions:
  contents: read
jobs:
  issue-786:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 9542a05c75668de7dc7c1f61c62b40467bdaf158
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install declared dependencies
        run: python -m pip install -r requirements.txt
      - name: Run official issue-786 catalogue group on pinned candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '9542a05c75668de7dc7c1f61c62b40467bdaf158'
          git switch -c issue-786-central-invocation-wrapper-20261102
          python - <<'PY'
          import subprocess
          import sys
          from pathlib import Path
          from repo_workflow.self_ci import group_command
          root = Path.cwd()
          command = group_command(root, 'issue-786-cmd-wrapper')
          print('catalogue group: issue-786-cmd-wrapper', flush=True)
          print('command:', command, flush=True)
          sys.exit(subprocess.run(command, cwd=root, check=False).returncode)
          PY
