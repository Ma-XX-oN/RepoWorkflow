name: RWF 109 integration version workbench
on:
  push:
    branches:
      - issue-109-consumer-integration-adapter-20261031
    paths:
      - .ci/issue-109-integration-prep
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Prepare independent integration phase and host request
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python repo_workflow.py --root . test integration --remote
          git show HEAD:.ci/run
          git show HEAD^:.ci/engine-version
          git status --porcelain
