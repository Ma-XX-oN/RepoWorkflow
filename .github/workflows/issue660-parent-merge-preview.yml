name: RWF 660 actual child-parent integration candidate
on:
  push:
    branches: ['issue-660-legacy-merge-diagnostic-20261106']
    paths: ['.github/workflows/issue660-parent-merge-preview.yml']
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Merge accepted #789 including #790 into recorded #787 parent
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'RWF 660 integration'
          git config user.email 'rwf@localhost'
          git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*'
          parent=adeee33df66c0eb95d454e2eb06ddee2c2de9cd6
          child=b2a28fbda41deb20b0d307bf107859cd3ffc2372
          candidate=issue-660-parent-787-integration-20261106
          test "$(git rev-parse refs/remotes/origin/issue-787-cmd-request-transport-20261102)" = "$parent"
          test "$(git rev-parse refs/remotes/origin/issue-789-cmd-results-20261102)" = "$child"
          git switch --create "$candidate" "$parent"
          set +e
          git merge --no-ff --no-commit "$child"
          rc=$?
          set -e
          echo "INITIAL_MERGE_RC=$rc"
          test "$rc" -eq 0 -o "$rc" -eq 1
          git diff --name-only --diff-filter=U > "$RUNNER_TEMP/conflicts"
          cat "$RUNNER_TEMP/conflicts"
          if grep -v -xE '^\.ci/(run|engine-version)$' "$RUNNER_TEMP/conflicts"; then
            echo 'UNEXPECTED_MERGE_CONFLICT'; exit 1
          fi
          git restore --source=HEAD --staged --worktree -- .ci/run .ci/engine-version
          test -z "$(git ls-files -u)"
          test "$(git show HEAD:.ci/run | sha256sum | cut -d' ' -f1)" = "$(sha256sum .ci/run | cut -d' ' -f1)"
          test "$(git show HEAD:.ci/engine-version | sha256sum | cut -d' ' -f1)" = "$(sha256sum .ci/engine-version | cut -d' ' -f1)"
          git diff --cached --check
          git commit --no-edit
          sha=$(git rev-parse HEAD)
          echo "MERGE_COMMIT=$sha"
          echo "MERGE_PARENTS=$(git rev-list --parents -n 1 HEAD)"
          test "$(git rev-parse HEAD^1)" = "$parent"
          test "$(git rev-parse HEAD^2)" = "$child"
          git diff --check HEAD^1 HEAD
          git diff --name-status HEAD^1 HEAD
          python -m compileall -q repo_workflow repo_workflow.py scripts
          python - <<'PY'
          from pathlib import Path
          from repo_workflow.self_ci import group_command
          import subprocess, sys
          root=Path.cwd()
          for name in ['issue-787-cmd-transport','issue-789-cmd-results','issue-790-remote-status','issue-792-provider-status']:
              cmd=group_command(root,name)
              print("CATALOGUE_GROUP",name,"COMMAND",cmd,flush=True)
              rc=subprocess.run(cmd,cwd=root,check=False).returncode
              print("CATALOGUE_RESULT",name,rc,flush=True)
              if rc: sys.exit(rc)
          PY
          git push --porcelain origin "HEAD:refs/heads/$candidate"
          actual=$(git ls-remote origin "refs/heads/$candidate" | cut -f1)
          test "$actual" = "$sha"
          echo "PUBLISHED_PARENT_CANDIDATE=$candidate $sha"
