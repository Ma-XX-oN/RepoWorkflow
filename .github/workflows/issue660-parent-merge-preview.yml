name: RWF 660 post-merge registered native verification
on:
  push:
    branches: ['issue-660-legacy-merge-diagnostic-20261106']
    paths: ['.github/workflows/issue660-parent-merge-preview.yml']
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 9495b18dc3579acec135325db37bad5771f8a850
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify exact integrated source and existing registered groups
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '9495b18dc3579acec135325db37bad5771f8a850'
          python - <<'PY'
          from pathlib import Path
          from repo_workflow.self_ci import group_command
          from repo_workflow.engine_version_adapter import read_engine_version
          import subprocess,sys
          root=Path.cwd()
          assert read_engine_version(root)=='0.1.122'
          groups=('issue-786-cmd-wrapper','issue-787-cmd-transport','issue-788-hosted-forward','issue-789-cmd-results','issue-790-remote-status','issue-792-provider-status','issue-660-utf8-output-enforcement','issue-719-launcher-discovery-utf8','issue-727-portable-subprocess')
          for name in groups:
              cmd=group_command(root,name)
              print('RUNNING_REGISTERED_GROUP',name,cmd,flush=True)
              result=subprocess.run(cmd,cwd=root,check=False)
              print('REGISTERED_GROUP_OUTCOME',name,result.returncode,flush=True)
              if result.returncode: sys.exit(result.returncode)
          print('REGISTERED_GROUPS_PASSED',len(groups),flush=True)
          PY
