name: RWF 660 Windows remaining registered groups supplemental verification
on:
  push:
    branches: ['issue-660-legacy-merge-diagnostic-20261106']
    paths: ['.github/workflows/issue660-parent-merge-preview.yml']
permissions:
  contents: read
jobs:
  full-catalogue:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bfc3ac6cac62d8b18f8ce9ccd1b96c18f38e0124
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install repository-declared runtime dependencies
        shell: bash
        run: python -m pip install -r requirements.txt
      - name: Verify Windows catalogue groups 82-114 missed by timed-out full run
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 'bfc3ac6cac62d8b18f8ce9ccd1b96c18f38e0124'
          python - <<'PY'
          from pathlib import Path
          from repo_workflow.self_ci import group_command
          from repo_workflow.test_catalogue import load_test_catalogue
          import subprocess,sys,traceback
          root=Path.cwd()
          available=load_test_catalogue(root).groups
          all_groups=tuple(sorted(available))
          assert len(all_groups)==114, 'authoritative catalogue changed'
          assert all_groups[80]=='issue-583-authoritative-validate', 'diagnostic boundary changed'
          groups=all_groups[81:]
          assert len(groups)==33, 'missing remaining registered groups'
          assert all(x in available for x in groups)
          print('REGISTERED_GROUP_COUNT',len(groups),flush=True)
          failures=[]
          for index,name in enumerate(groups,1):
              print('RUNNING_REGISTERED_GROUP',index,len(groups),name,flush=True)
              try:
                  argv=group_command(root,name)
                  done=subprocess.run(argv,cwd=root,check=False)
                  code=done.returncode
              except Exception:
                  traceback.print_exc()
                  code=99
              print('REGISTERED_GROUP_OUTCOME',name,code,flush=True)
              if code:
                  failures.append((name,code))
          print('REGISTERED_GROUPS_TOTAL',len(groups),flush=True)
          print('REGISTERED_GROUPS_FAILED',repr(failures),flush=True)
          if failures:
              sys.exit(1)
          PY
