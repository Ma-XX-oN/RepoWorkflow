name: RWF 660 Unicode origin/ref final exact-SHA full native catalogue
on:
  push:
    branches: ['issue-660-wrapper-portability-native-3os-20261107']
    paths: ['.github/workflows/issue660-parent-merge-preview.yml']
permissions:
  contents: read
jobs:
  full-catalogue:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: aafce78dc041a9fb164a014b62813d2ca26cb03c
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install repository-declared runtime dependencies
        shell: bash
        run: python -m pip install -r requirements.txt
      - name: Run every registered catalogue group without exclusions
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 'aafce78dc041a9fb164a014b62813d2ca26cb03c'
          python - <<'PY'
          from pathlib import Path
          from repo_workflow.self_ci import group_command
          from repo_workflow.test_catalogue import load_test_catalogue
          import subprocess,sys,traceback
          root=Path.cwd()
          available=load_test_catalogue(root).groups
          groups=tuple(sorted(available))
          assert groups, 'authoritative test catalogue is empty'
          assert all(x in available for x in groups)
          print('REGISTERED_GROUP_COUNT',len(groups),flush=True)
          failures=[]
          for index,name in enumerate(groups,1):
              print('RUNNING_REGISTERED_GROUP',index,len(groups),name,flush=True)
              try:
                  argv=group_command(root,name)
                  done=subprocess.run(argv,cwd=root,check=False)
                  code=done.returncode
              except Exception:
                  traceback.print_exc()
                  code=99
              print('REGISTERED_GROUP_OUTCOME',name,code,flush=True)
              if code:
                  failures.append((name,code))
          print('REGISTERED_GROUPS_TOTAL',len(groups),flush=True)
          print('REGISTERED_GROUPS_FAILED',repr(failures),flush=True)
          if failures:
              sys.exit(1)
          PY
