name: RWF 660 parent version authority and catalogue acceptance
on:
  push:
    branches: ['issue-660-legacy-merge-diagnostic-20261106']
    paths: ['.github/workflows/issue660-parent-merge-preview.yml']
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Remove inherited child version from accepted #785 parent candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'RWF 660 integration'
          git config user.email 'rwf@localhost'
          candidate=issue-660-parent-785-integration-20261106
          expected=78669eaabcf0b563c607d7bb388a9f251c194cd6
          git fetch --no-tags origin "refs/heads/$candidate:refs/remotes/origin/$candidate"
          test "$(git rev-parse refs/remotes/origin/$candidate)" = "$expected"
          git switch --create "$candidate" "$expected"
          test "$(cat .ci/engine-version)" = '0.1.122-issue.787.0.3'
          # #785 originally had no issue-specific version; do not inherit #787's.
          git rm -- .ci/engine-version
          git commit -m 'chore(#785): restore parent-owned development version authority'
          python - <<'PY'
          from pathlib import Path
          from repo_workflow.engine_version_adapter import read_engine_version
          from repo_workflow.self_ci import group_command
          import subprocess, sys
          root=Path.cwd()
          assert read_engine_version(root)==root.joinpath('VERSION').read_text(encoding='utf-8').strip()
          print('VERSION_AUTHORITY',read_engine_version(root),flush=True)
          for name in ('issue-786-cmd-wrapper','issue-787-cmd-transport','issue-788-hosted-forward','issue-789-cmd-results','issue-790-remote-status','issue-792-provider-status'):
              cmd=group_command(root,name)
              print('CATALOGUE_GROUP',name,flush=True)
              result=subprocess.run(cmd,cwd=root,check=False)
              print('CATALOGUE_RESULT',name,result.returncode,flush=True)
              if result.returncode: sys.exit(result.returncode)
          PY
          git diff --check HEAD^ HEAD
          sha=$(git rev-parse HEAD)
          test "$(git rev-parse HEAD^)" = "$expected"
          test "$(git ls-remote origin refs/heads/$candidate | cut -f1)" = "$expected"
          git push --porcelain origin "HEAD:refs/heads/$candidate"
          test "$(git ls-remote origin refs/heads/$candidate | cut -f1)" = "$sha"
          echo "PARENT_785_VERSION_CORRECTED_CANDIDATE=$sha"
