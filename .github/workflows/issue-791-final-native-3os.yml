name: RWF 791 final combined exact-source native regression
on:
  push:
    branches:
      - issue-791-complete-native-acceptance-20261104
    paths:
      - .github/workflows/issue-791-final-native-3os.yml
permissions:
  contents: read
jobs:
  native-regression:
    name: native-regression (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 03afb8539cf86d474835e2bccabae7de498d6824
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Assert exact accepted-source identity
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "03afb8539cf86d474835e2bccabae7de498d6824"
          git --version
          python --version
      - name: Install declared dependencies
        shell: bash
        run: python -m pip install -r requirements.txt
      - name: Execute full registered regression
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$GITHUB_REF_NAME"
          ./rwf test regression
