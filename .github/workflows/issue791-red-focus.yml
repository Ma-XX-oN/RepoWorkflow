name: RWF 791 RED help diagnostic
on:
  push:
    branches:
      - issue-791-red-convergence-20261104
    paths:
      - '.ci/issue791-red-focus-trigger'
permissions:
  contents: read
jobs:
  red-help:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bd563bfe19dde4cfc8a26f733ee7b179814d3b8c
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Prepare pinned source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = bd563bfe19dde4cfc8a26f733ee7b179814d3b8c
          python -m pip install -r requirements.txt
          git switch -c issue-791-red-help-diagnostic-20261104
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Focused public RED help parity
        shell: bash
        run: |
          python -m unittest -v \
            tests.test_bootstrap_cli.BootstrapCliTests.test_red_help_uses_current_issue_catalogue_and_errors \
            tests.test_completion.BashCompletionTests.test_red_single_tab_and_double_tab_equal_direct_help \
            tests.test_completion.BashCompletionTests.test_red_missing_groups_report_same_real_error \
            tests.test_test_launcher.ShippedTestLauncher.test_shipped_red_help_is_current_issue_aware
