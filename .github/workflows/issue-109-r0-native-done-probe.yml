name: RWF #109 native done R0 compatibility probe
on:
  push:
    branches:
      - issue-109-r0-native-done-probe-20261022t1348
permissions:
  contents: read
jobs:
  native_done:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt
      - name: Existing native executor and MIT negative tests
        run: python -m unittest -v tests.test_done_cli tests.test_done_executor tests.test_done_runtime tests.test_done_completion tests.test_done_mit_defer_v2
