name: RWF 809 exact-source Git callsite profile
on:
  push:
    branches: [issue-809-git-startup-probe]
    paths:
      - experiments/rwf809_profiler/**
      - .github/workflows/rwf-809-callsite.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout exact assembled #791 candidate (read only)
        uses: actions/checkout@v4
        with:
          repository: Ma-XX-oN/RepoWorkflow
          ref: 929fbbe1e00251c39c7191e6822c36c37f5d802f
          path: target
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install declared runtime requirements
        run: python -m pip install -r target/requirements.txt
      - name: Validate tracer syntax
        run: python -m py_compile experiments/rwf809_profiler/sitecustomize.py experiments/rwf809_profiler/aggregate.py experiments/rwf809_profiler/launch.py
      - name: Profile exact-source regression without product mutation
        id: profile
        shell: bash
        run: |
          set +e
          python experiments/rwf809_profiler/launch.py target regression
          rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Aggregate process call graph
        if: always()
        run: python experiments/rwf809_profiler/aggregate.py rwf809-process-logs rwf809-process-summary.json
      - name: Upload sanitized raw logs and aggregate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rwf809-assembled-process-profile
          path: |
            rwf809-process-logs/*.jsonl
            rwf809-process-summary.json
      - name: Preserve underlying regression result
        if: always()
        shell: bash
        run: |
          test "${{ steps.profile.outputs.rc }}" = "0"
