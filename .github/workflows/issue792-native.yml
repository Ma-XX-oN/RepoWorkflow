name: RWF 792 Native Provider Discovery Workbench

# Issue-only focused native checks; the official regression remains .ci/run.
on:
  push:
    branches:
      - issue-792-provider-status-v2-20261102
    paths:
      - .ci/run

permissions:
  contents: read

jobs:
  native-status:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.before }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt
      - name: Verify exact request source and registered #792 group
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.before }}"
          python - <<'PY'
          import json
          from pathlib import Path
          j = json.loads(Path(".ci/tests.json").read_text(encoding="utf-8"))
          found = [g["issue-792-provider-status"] for g in j["tests"]
                   if "issue-792-provider-status" in g]
          assert len(found) == 1
          assert found[0] == {
            "type": "regression", "name": "tests.test_issue792_provider_status",
          }
          print("RWF_792_SOURCE=" + __import__("subprocess").check_output(
            ["git", "rev-parse", "HEAD"], text=True).strip())
          PY
          python -m py_compile repo_workflow/repo_info_adapter.py \
            adapters/repo-info-ci-github.py tests/test_issue792_provider_status.py
      - name: Execute registered #792 native tests
        shell: bash
        run: python -m unittest -v tests.test_issue792_provider_status
