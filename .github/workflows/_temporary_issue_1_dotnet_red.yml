name: Temporary issue 1 dotnet RED

on:
  push:
    branches:
      - tmp-issue-1-dotnet-red
    paths:
      - .github/workflows/_temporary_issue_1_dotnet_red.yml

permissions:
  contents: read

jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b3508437a5a7d1c84c88325a8541c0cb2c8817b1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Execute dotnet projection RED
        run: python -m unittest tests/test_dotnet_toolchain_projection.py
