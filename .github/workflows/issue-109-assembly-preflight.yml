name: RWF 109 isolated certified-source assembly
on:
  push:
    branches:
      - issue-109-v3-stack-assembly-probe-20261020
permissions:
  contents: read
  issues: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install declared runtime dependencies
        run: python -m pip install -r requirements.txt cryptography
      - name: Assemble #109 plus certified #103 #681 #683 without remote mutation
        run: python scripts/issue-109-assemble-probe.py
      - name: Report exact-source assembly result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ job.status }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          gh issue comment 109 -R Ma-XX-oN/RepoWorkflow --body "RWF #109 disposable exact-source assembly (no remote merge) 13682b27baf21e6f5d1abc2620ec23a7587f13d6 + #103 d6acd97219ac45a90634d0a8c0b90780e9b7e5ff + #681 4938f73312691e7e593cd758965eb538f9e40baf + #683 ba3dde739701fcd358a01faf6f134078b0bf7924: $OUTCOME. Run: https://github.com/Ma-XX-oN/RepoWorkflow/actions/runs/$RUN_ID"
