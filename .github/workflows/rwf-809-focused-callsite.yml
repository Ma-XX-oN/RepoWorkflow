name: RWF 809 current source three-OS focused callsite
on:
  push:
    branches: [issue-809-git-startup-probe]
    paths: [.github/workflows/rwf-809-focused-callsite.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  profile:
    name: Callsite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-26-arm64]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout pinned RWF #791 candidate read-only
        uses: actions/checkout@v4
        with:
          repository: Ma-XX-oN/RepoWorkflow
          ref: 929fbbe1e00251c39c7191e6822c36c37f5d802f
          path: target
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install declared requirements
        shell: bash
        run: python -m pip install -r target/requirements.txt
      - name: Compile profiler and aggregator
        shell: bash
        run: python -m py_compile experiments/rwf809_profiler/sitecustomize.py experiments/rwf809_profiler/aggregate.py experiments/rwf809_profiler/launch.py
      - name: Execute focused exact-source remote invocation tests
        id: test
        shell: bash
        run: |
          set +e
          python experiments/rwf809_profiler/launch.py target module tests.test_remote_invocation_786
          code=$?
          echo "rc=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Aggregate sanitized callsite metrics
        if: always()
        shell: bash
        run: python experiments/rwf809_profiler/aggregate.py rwf809-process-logs rwf809-process-summary.json
      - name: Upload profile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rwf809-current-focused-${{ matrix.os }}
          path: |
            rwf809-process-summary.json
            rwf809-process-logs/*.jsonl
          if-no-files-found: warn
      - name: Preserve test result
        if: always()
        shell: bash
        run: test "${{ steps.test.outputs.rc }}" = "0"
