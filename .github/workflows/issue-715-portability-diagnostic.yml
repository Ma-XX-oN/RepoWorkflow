name: RWF 715 exact-source native portability diagnostics
on:
  push:
    branches: [issue-715-residual-leaves-native-v3-20261023]
    paths: [.github/workflows/issue-715-portability-diagnostic.yml]
permissions:
  contents: read
jobs:
  exact-portability-leaf:
    name: "${{ matrix.leaf.id }} / ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        leaf:
          - id: assembled-focused
            sha: 8ec67ae7827f68383432faf7be4eda5125b0cbf2
            modules: tests.test_git_protocol_boundary_p10 tests.test_process_boundary_p10 tests.test_config tests.test_dedicated_test_commits tests.test_workspace_worktree tests.test_state_store tests.test_windows_unicode_output_p9 tests.test_canonical_lane_smoke tests.test_local_terminal_jsonl_p16 tests.test_local_terminal tests.test_retry_evidence tests.test_bootstrap_cli tests.test_first_use_lanes tests.test_first_use_lanes_provider tests.test_first_use_lanes_refresh tests.test_first_use_lanes_state tests.test_provider_adapter_p11 tests.test_github_ticket_dependencies tests.test_repo_info_adapter tests.test_ticket_dependency_adapter
          - id: assembled-full-regression
            sha: 8ec67ae7827f68383432faf7be4eda5125b0cbf2
            modules: discover -s tests -p 'test_*.py'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.leaf.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Record and assert source SHA, interpreter and OS
        shell: bash
        env:
          SOURCE_SHA: ${{ matrix.leaf.sha }}
          LEAF: ${{ matrix.leaf.id }}
        run: |
          python - <<'PY'
          import os, platform, shutil, subprocess, sys
          actual = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          print('LEAF=' + os.environ['LEAF'])
          print('TESTED_SOURCE_SHA=' + actual)
          print('WORKFLOW_SHA=' + os.getenv('GITHUB_SHA', ''))
          print('OS=' + platform.platform())
          print('PYTHON=' + sys.executable)
          print('VERSION=' + sys.version)
          print('BASH=' + str(shutil.which('bash')))
          print('BASH_TAB_INTEGRATION=NOT_RUN_LEAF_SCOPE')
          assert actual == os.environ['SOURCE_SHA']
          assert sys.version_info >= (3, 10)
          PY
      - name: Install project requirements
        run: python -m pip install -r requirements.txt
      - name: Native tests for pinned leaf, preserve failure
        shell: bash
        env:
          TEST_MODULES: ${{ matrix.leaf.modules }}
          GH_PROMPT_DISABLED: '1'
          GIT_TERMINAL_PROMPT: '0'
        run: |
          set -o pipefail
          python -m unittest -v $TEST_MODULES 2>&1 | tee native-leaf-results.txt
      - name: Keep native test log with exact SHA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "rwf715-${{ matrix.leaf.id }}-${{ matrix.os }}-${{ matrix.leaf.sha }}"
          path: native-leaf-results.txt
          if-no-files-found: warn
          retention-days: 14
