name: RWF 715 OS portability diagnostic (unmerged)
on:
  push:
    branches:
      - issue-715-portability-diagnostic-v3-20261023
    paths:
      - .github/workflows/issue-715-portability-diagnostic.yml

# Test-only, no production actions and no provider tokens.
permissions:
  contents: read

jobs:
  scoped-portability:
    name: "Read-only portability: ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Record exact run and interpreter identity
        run: |
          python -c "import os,platform,shutil,sys; print('OS=' + platform.platform()); print('PYTHON=' + sys.executable); print('VERSION=' + sys.version); print('BASH=' + str(shutil.which('bash'))); print('HEAD=' + str(os.getenv('GITHUB_SHA'))); print('BASH_TAB_INTEGRATION=NOT_RUN_DIAGNOSTIC_ONLY')"
      - name: Core Python CLI root help (no shell script)
        if: always()
        run: python repo_workflow.py --help
      - name: Core Python CLI nested help
        if: always()
        run: python repo_workflow.py test --help
      - name: RED help rejects missing started issue, not static success
        if: always()
        run: |
          python -c "import subprocess,sys; p=subprocess.run([sys.executable,'repo_workflow.py','test','RED','--help'],capture_output=True,text=True); print('EXIT=' + str(p.returncode)); print('STDOUT=' + repr(p.stdout)); print('STDERR=' + repr(p.stderr)); sys.exit(0 if p.returncode != 0 and 'Register current issue-' not in p.stdout else 1)"
      - name: Existing cross-platform targeted portability regression
        if: always()
        run: |
          python -m unittest -q tests.test_terminal_tag tests.test_dedicated_test_commits tests.test_bootstrap_cli tests.test_first_use_lanes tests.test_canonical_lane_smoke tests.test_launcher
