name: RWF 715 exact-source native portability diagnostics
on:
  push:
    branches: [issue-715-portability-leaves-native-v3-20261023]
    paths: [.github/workflows/issue-715-portability-diagnostic.yml]
permissions:
  contents: read
jobs:
  exact-portability-leaf:
    name: "${{ matrix.leaf.id }} / ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        leaf:
          - id: P1-718
            sha: 459338c31a2c015e384f38ac675ee5dbc0ab0a0f
            modules: tests.test_terminal_tag tests.test_consumer_terminal_lifecycle tests.test_hosted_terminal_binding tests.test_local_terminal
          - id: P2-719
            sha: dd9fc8ebc8e42ae9d16e8e8ca5c646107c19c25f
            modules: tests.test_launcher tests.test_canonical_lane_smoke tests.test_repo_info_adapter
          - id: P3-720
            sha: 55a6fdb0645f5e75a5a5e832a92779fe10a041a4
            modules: tests.test_dedicated_test_commits tests.test_workspace_worktree
          - id: P4-721
            sha: 5c26d5a0e56f328b176a2dea9f5810c69968dfe8
            modules: tests.test_bootstrap_cli tests.test_first_use_lanes
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.leaf.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Record and assert source SHA, interpreter and OS
        shell: bash
        env:
          SOURCE_SHA: ${{ matrix.leaf.sha }}
          LEAF: ${{ matrix.leaf.id }}
        run: |
          python - <<'PY'
          import os, platform, shutil, subprocess, sys
          actual = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          print('LEAF=' + os.environ['LEAF'])
          print('TESTED_SOURCE_SHA=' + actual)
          print('WORKFLOW_SHA=' + os.getenv('GITHUB_SHA', ''))
          print('OS=' + platform.platform())
          print('PYTHON=' + sys.executable)
          print('VERSION=' + sys.version)
          print('BASH=' + str(shutil.which('bash')))
          print('BASH_TAB_INTEGRATION=NOT_RUN_LEAF_SCOPE')
          assert actual == os.environ['SOURCE_SHA']
          assert sys.version_info >= (3, 10)
          PY
      - name: Install project requirements
        run: python -m pip install -r requirements.txt
      - name: Native tests for pinned leaf, preserve failure
        shell: bash
        env:
          TEST_MODULES: ${{ matrix.leaf.modules }}
          GH_PROMPT_DISABLED: '1'
          GIT_TERMINAL_PROMPT: '0'
        run: |
          set -o pipefail
          python -m unittest -v $TEST_MODULES 2>&1 | tee native-leaf-results.txt
      - name: Keep native test log with exact SHA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "rwf715-${{ matrix.leaf.id }}-${{ matrix.os }}-${{ matrix.leaf.sha }}"
          path: native-leaf-results.txt
          if-no-files-found: warn
          retention-days: 14
