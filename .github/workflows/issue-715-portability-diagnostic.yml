name: RWF 715 exact-source G3 G4 G7 native three-OS matrix
on:
  push:
    branches: [issue-715-residual-leaves-native-v3-20261023]
    paths: [.github/workflows/issue-715-portability-diagnostic.yml]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  focused:
    name: "${{ matrix.lane.id }} / ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        lane:
          - id: P2-G3-G10
            sha: bd15fb2b805a46cf19544839b6334c50ff2438c1
            modules: tests.test_workflow_cli tests.test_issue629_selection_acceptance tests.test_issue629_stage_cardinality tests.test_issue629_cli_acceptance tests.test_lane_component_selection_cli tests.test_lane_count
          - id: P4-G4-G6
            sha: 398f77cbb559a3f9c611f293fb60c05edbda6eac
            modules: tests.test_bootstrap_cli tests.test_first_use_lanes tests.test_first_use_lanes_provider tests.test_first_use_lanes_refresh tests.test_first_use_lanes_state tests.test_dependency_migration_tool
          - id: G7-G8
            sha: dfc1c61e7fd51457145806c32769700d1e63a025
            modules: tests.test_completion tests.test_test_cli tests.test_red_completion_cli tests.test_test_launcher
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.lane.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Assert exact candidate and runner
        shell: bash
        env:
          EXPECTED_SHA: ${{ matrix.lane.sha }}
          LANE: ${{ matrix.lane.id }}
        run: |
          python - <<'PY'
          import os, subprocess, sys, platform
          actual=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          print('LANE='+os.environ['LANE'],flush=True)
          print('EXACT_TESTED_SHA='+actual,flush=True)
          print('EXPECTED_SHA='+os.environ['EXPECTED_SHA'],flush=True)
          print('NATIVE_OS='+platform.platform(),flush=True)
          print('INTERPRETER='+sys.executable,flush=True)
          assert actual==os.environ['EXPECTED_SHA']
          PY
      - name: Install requirements
        run: python -m pip install -r requirements.txt
      - name: Run focused native suite preserving all outcomes
        shell: bash
        env:
          MODULES: ${{ matrix.lane.modules }}
          LANE: ${{ matrix.lane.id }}
          GH_PROMPT_DISABLED: '1'
          GIT_TERMINAL_PROMPT: '0'
        run: |
          set -o pipefail
          python -m unittest -v $MODULES 2>&1 | tee "rwf715-$LANE-results.log"
      - name: Upload source-bound log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rwf715-${{ matrix.lane.id }}-${{ matrix.os }}-${{ matrix.lane.sha }}
          path: rwf715-${{ matrix.lane.id }}-results.log
          if-no-files-found: warn
          retention-days: 30
