name: RWF 715 exact-source P4 and P7 corrected native three-OS matrix
on:
  push:
    branches: [issue-715-residual-leaves-native-v3-20261023]
    paths: [.github/workflows/issue-715-portability-diagnostic.yml]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  focused:
    name: "${{ matrix.lane.id }} / ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        lane:
          - id: P4-G4-G6
            sha: edcb46fbb3a6bbf7bdd0bfe5f4d902bc93d6ad4d
            modules: tests.test_bootstrap_cli tests.test_dependency_migration_tool tests.test_first_use_lanes tests.test_first_use_lanes_provider tests.test_first_use_lanes_refresh tests.test_first_use_lanes_state
          - id: P4-G7-CONVERGENCE
            sha: c0258afe1989511e9bfaf895376a3c1773551704
            modules: tests.test_bootstrap_cli tests.test_dependency_migration_tool tests.test_first_use_lanes tests.test_first_use_lanes_provider tests.test_first_use_lanes_refresh tests.test_first_use_lanes_state
          - id: P7-G5
            sha: 082e0b5c9ed2d28bbe08b589896f6e85d79c7045
            modules: tests.test_hosted_version_identity tests.test_hosted_version_utf8
          - id: G11-MIGRATION-CERTIFICATION
            sha: 082e0b5c9ed2d28bbe08b589896f6e85d79c7045
            modules: tests.test_dependency_migration_certification
          - id: G9-RENDERER-CERTIFICATION
            sha: 082e0b5c9ed2d28bbe08b589896f6e85d79c7045
            modules: tests.test_renderer_certification_binding
          - id: P17-G2-LONGPATHS
            sha: 082e0b5c9ed2d28bbe08b589896f6e85d79c7045
            modules: tests.test_prelim_integration tests.test_prelim_validation
          - id: P15-GIT-LAUNCHER
            sha: 082e0b5c9ed2d28bbe08b589896f6e85d79c7045
            modules: tests.test_launcher_discovery tests.test_launcher_discovery_utf8
          - id: P12-GIT-PATH-IDENTITY
            sha: 082e0b5c9ed2d28bbe08b589896f6e85d79c7045
            modules: tests.test_classification tests.test_artifacts
          - id: P14-STRICT-SUBPROCESS
            sha: 082e0b5c9ed2d28bbe08b589896f6e85d79c7045
            modules: tests.test_portability_subprocess tests.test_self_ci tests.test_test_cli
          - id: P1-G1
            sha: 56ae8b624038e13c0695bb323c98d64741d2d319
            modules: tests.test_terminal_tag
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.lane.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Assert exact candidate and runner
        shell: bash
        env:
          EXPECTED_SHA: ${{ matrix.lane.sha }}
          LANE: ${{ matrix.lane.id }}
        run: |
          python - <<'PY'
          import os, subprocess, sys, platform
          actual=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          print('LANE='+os.environ['LANE'],flush=True)
          print('EXACT_TESTED_SHA='+actual,flush=True)
          print('EXPECTED_SHA='+os.environ['EXPECTED_SHA'],flush=True)
          print('NATIVE_OS='+platform.platform(),flush=True)
          print('INTERPRETER='+sys.executable,flush=True)
          assert actual==os.environ['EXPECTED_SHA']
          PY
      - name: Install requirements
        run: python -m pip install -r requirements.txt
      - name: Run focused native suite preserving all outcomes
        id: suite
        shell: bash
        env:
          MODULES: ${{ matrix.lane.modules }}
          LANE: ${{ matrix.lane.id }}
          GH_PROMPT_DISABLED: '1'
          GIT_TERMINAL_PROMPT: '0'
        run: |
          set -o pipefail
          python -m unittest -v $MODULES 2>&1 | tee "rwf715-$LANE-results.log"
      - name: Upload source-bound log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rwf715-${{ matrix.lane.id }}-${{ matrix.os }}-${{ matrix.lane.sha }}
          path: rwf715-${{ matrix.lane.id }}-results.log
          if-no-files-found: warn
          retention-days: 30
      - name: Publish native result to RWF 715
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          LANE: ${{ matrix.lane.id }}
          TARGET_OS: ${{ matrix.os }}
          SOURCE_SHA: ${{ matrix.lane.sha }}
          SUITE_OUTCOME: ${{ steps.suite.outcome }}
          RUN_ID: ${{ github.run_id }}
        run: |
          body="P5 native source-bound result: lane=$LANE os=$TARGET_OS source=$SOURCE_SHA suite=$SUITE_OUTCOME run=https://github.com/$GH_REPO/actions/runs/$RUN_ID. Inspect the named artifact and test log before acceptance."
          gh api "repos/$GH_REPO/issues/715/comments" -f "body=$body"
