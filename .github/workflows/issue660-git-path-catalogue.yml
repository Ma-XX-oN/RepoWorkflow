name: RWF 660 corrected Unicode path filesystem-identity catalogue
on:
  push:
    branches: ['issue-660-unicode-oracle-focused-3os-20261107']
    paths: ['.github/workflows/issue660-git-path-catalogue.yml']
permissions:
  contents: read
jobs:
  focused-catalogue:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cdc4f220751c0e22416f46d2426ad7792e474dd8
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt
        shell: bash
      - name: Run authoritative registered CMD transport group
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = cdc4f220751c0e22416f46d2426ad7792e474dd8
          python - <<'PY'
          import subprocess
          from pathlib import Path
          from repo_workflow.test_catalogue import load_test_catalogue
          from repo_workflow.self_ci import group_command
          root=Path.cwd()
          group="issue-787-cmd-transport"
          assert group in load_test_catalogue(root).groups
          raise SystemExit(subprocess.run(group_command(root,group),cwd=root).returncode)
          PY
