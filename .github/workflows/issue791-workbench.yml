name: RWF 791 Isolated Native Workbench
on:
  push:
    branches:
      - 'issue-791-*'
    paths:
      - '.ci/run'
permissions:
  contents: read
jobs:
  native-assembly:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.before }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt
      - name: Confirm pinned source and accepted blobs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '${{ github.event.before }}'
          test "$(git rev-parse HEAD:repo_workflow/remote_request.py)" = 'fc3478bc7d768b4e63f4d5fc4a8aacc10f604d38'
          python -m compileall -q repo_workflow.py repo_workflow scripts tests
      - name: Registered CMD and CLI acceptance modules
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest -v tests.test_remote_invocation_786 tests.test_issue787_remote_request tests.test_issue788_hosted_forward tests.test_remote_result_789 tests.test_issue792_provider_status tests.test_remote_status_790 tests.test_ci_invocation_trigger_contract
