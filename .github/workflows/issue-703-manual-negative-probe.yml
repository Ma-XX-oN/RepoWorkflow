name: RWF 703 Independent MIT Negative Oracle
on:
  push:
    branches:
      - 'issue-703-mit-negative-*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  negative-contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install declared dependencies
        run: python -m pip install -r requirements.txt
      - name: Exercise independent RED MIT FAIL / no-CAS oracle
        shell: bash
        run: |
          set -o pipefail
          python -m unittest tests.test_manual_mit_negative_acceptance -v 2>&1 | tee test-output.txt
      - name: Retain independent evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rwf-703-negative-${{ matrix.os }}-${{ github.sha }}
          path: test-output.txt
          if-no-files-found: warn
          retention-days: 14
