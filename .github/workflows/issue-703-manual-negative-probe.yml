name: RWF 703 Independent MIT Negative Oracle
on:
  push:
    branches:
      - 'issue-703-mit-negative-*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  negative-contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install declared dependencies
        run: python -m pip install -r requirements.txt
      - name: Exercise independent RED MIT FAIL / no-CAS oracle
        shell: bash
        run: |
          set -o pipefail
          python -m unittest tests.test_manual_mit_negative_acceptance -v 2>&1 | tee test-output.txt
      - name: Retain independent evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rwf-703-negative-${{ matrix.os }}-${{ github.sha }}
          path: test-output.txt
          if-no-files-found: warn
          retention-days: 14

  version-contract-known-red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Exercise three explicit unfulfilled Q+1/R=0 contracts
        shell: bash
        run: |
          set -euo pipefail
          set +e
          python -m unittest tests.test_manual_mit_version_contract -v > version-red.txt 2>&1
          outcome=$?
          set -e
          cat version-red.txt
          test "$outcome" -ne 0
          grep -F 'test_development_version_parser_accepts_r_zero' version-red.txt
          grep -F 'test_version_adapter_accepts_required_failure_transition' version-red.txt
          grep -F 'test_real_engine_failure_transition_resets_iteration_to_zero' version-red.txt
          grep -F 'FAILED (failures=3)' version-red.txt
      - name: Archive explicit RED contract evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rwf-703-known-red-version-${{ github.sha }}
          path: version-red.txt
          if-no-files-found: warn
          retention-days: 14

  assembled-contract-probe:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install declared dependencies
        run: python -m pip install -r requirements.txt
      - name: Run isolated cross-lane A B C real test modules
        shell: bash
        run: |
          set -o pipefail
          python -m unittest tests.test_manual_test_catalogue tests.test_manual_test_result tests.test_manual_test_cli -v 2>&1 | tee assembled-tests.txt
      - name: Preserve provisional assembly results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rwf-703-assembled-probe-${{ matrix.os }}-${{ github.sha }}
          path: assembled-tests.txt
          if-no-files-found: warn
          retention-days: 14
