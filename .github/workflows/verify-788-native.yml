name: Verify #788 Native Forwarding
on:
  push:
    branches: ['verify-788-native-20261103']
    paths: ['.ci/native-run']
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: aee2ca8599240cf6eabff5d399400ca6f9ee58e6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify exact candidate source
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = aee2ca8599240cf6eabff5d399400ca6f9ee58e6
      - name: Execute registered #788, #786 and #787 suites
        shell: bash
        run: |
          python -m unittest -v tests.test_issue788_hosted_forward tests.test_remote_invocation_786 tests.test_issue787_remote_request
