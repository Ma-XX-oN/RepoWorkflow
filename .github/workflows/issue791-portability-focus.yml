name: RWF 791 Imported Portability Native Focus
on:
  push:
    branches:
      - issue-791-portability-integration-20261103
    paths:
      - '.ci/issue791-portability-trigger'
permissions:
  contents: read
jobs:
  portability:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 56b31a1f27aebcdb41a70541dd2b4aaeb66951c1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Exact source invariant and dependencies
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 56b31a1f27aebcdb41a70541dd2b4aaeb66951c1
          python -m pip install -r requirements.txt
          python -m compileall -q repo_workflow repo_workflow.py tests
      - name: Run affected native tests diagnostic
        shell: bash
        run: python -m unittest -v tests.test_terminal_tag tests.test_state_store tests.test_launcher tests.test_workflow_transitions
