name: Issue 103 verified retirement probe
on:
  push:
    branches:
      - issue-103-prelim-retirement-v1
  pull_request:
permissions:
  contents: read
jobs:
  retirement:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile retirement code
        run: |
          python -m py_compile repo_workflow/prelim_retirement.py repo_workflow/prelim_retirement_evidence.py repo_workflow/prelim_retirement_github.py repo_workflow/prelim_retirement_remote.py repo_workflow/prelim_retirement_execute.py repo_workflow/prelim_main_resync.py
      - name: Test exact retirement candidate
        run: |
          python -m unittest tests.test_prelim_retirement tests.test_prelim_retirement_evidence tests.test_prelim_retirement_github tests.test_prelim_retirement_remote tests.test_prelim_main_resync tests.test_prelim_retirement_execute
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install declared runtime dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Full regression
        run: |
          python -m unittest discover -s tests
