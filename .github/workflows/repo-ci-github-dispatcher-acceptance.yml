name: repo-ci GitHub dispatcher acceptance

on:
  pull_request:
    paths:
      - '.ci/repo-ci.json'
      - 'repo_workflow/repo_ci_dispatcher.py'
      - 'repo_workflow/repo_ci_github_provider.py'
      - 'repo_workflow/github_result_transport.py'
      - '.github/workflows/repo-ci-github-dispatcher-acceptance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Publish exact-bound artifact through configured dispatcher
        env:
          RWF_CANDIDATE: ${{ github.event.pull_request.head.sha || github.sha }}
          RWF_BASE: ${{ github.event.pull_request.base.sha || github.sha }}
          RWF_INVOCATION: ${{ github.run_id }}-${{ github.run_attempt }}
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          Path("producer").mkdir()
          Path("producer/evidence").write_bytes(b"genuine FAIL remains observation\n")
          request = {
            "contract_version": 1,
            "operation": "publish",
            "invocation_id": os.environ["RWF_INVOCATION"],
            "candidate": {
              "repository": os.environ["GITHUB_REPOSITORY"],
              "commit": os.environ["RWF_CANDIDATE"],
              "base": os.environ["RWF_BASE"],
            },
            "requirements": {
              "stages": [], "capabilities": [], "artifacts": ["evidence"],
            },
            "inputs": {"source_dir": "producer", "destination_dir": "bundle"},
          }
          Path("request.json").write_text(json.dumps(request))
          PY
          python -m repo_workflow.repo_ci_dispatcher publish < request.json > reply.json
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path("reply.json").read_text())
          assert result["status"] == "ok", result
          assert result["observations"]["transport"] == "published"
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: repo-ci-dispatcher-fixture
          path: bundle/
          if-no-files-found: error
          retention-days: 1

  fetch:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          name: repo-ci-dispatcher-fixture
          path: downloaded/
      - name: Fetch exact same-run evidence through configured dispatcher
        env:
          RWF_CANDIDATE: ${{ github.event.pull_request.head.sha || github.sha }}
          RWF_BASE: ${{ github.event.pull_request.base.sha || github.sha }}
          RWF_INVOCATION: ${{ github.run_id }}-${{ github.run_attempt }}
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          request = {
            "contract_version": 1, "operation": "fetch",
            "invocation_id": os.environ["RWF_INVOCATION"],
            "candidate": {
              "repository": os.environ["GITHUB_REPOSITORY"],
              "commit": os.environ["RWF_CANDIDATE"],
              "base": os.environ["RWF_BASE"],
            },
            "requirements": {
              "stages": [], "capabilities": [], "artifacts": ["evidence"],
            },
            "inputs": {"source_dir": "downloaded", "destination_dir": "accepted"},
          }
          Path("request.json").write_text(json.dumps(request))
          bad = dict(request)
          bad["candidate"] = {**request["candidate"], "base": "stale"}
          bad["inputs"] = {"source_dir": "downloaded", "destination_dir": "rejected"}
          Path("stale.json").write_text(json.dumps(bad))
          PY
          python -m repo_workflow.repo_ci_dispatcher fetch < request.json > reply.json
          python -m repo_workflow.repo_ci_dispatcher fetch < stale.json > stale-reply.json
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path("reply.json").read_text())
          assert result["status"] == "ok", result
          assert Path("accepted/evidence").read_bytes() == b"genuine FAIL remains observation\n"
          stale = json.loads(Path("stale-reply.json").read_text())
          assert stale["status"] == "error", stale
          assert stale["diagnostics"][0]["code"] == "identity-mismatch", stale
          assert not Path("rejected").exists()
          PY
