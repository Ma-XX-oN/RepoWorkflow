name: Issue 683 PRELIM producer bridge acceptance
on:
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  ready-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt
      - name: Test exact PRELIM bridge and provider creation
        run: |
          python -m unittest \
            tests.test_prelim_ready \
            tests.test_prelim_ready_git \
            tests.test_prelim_ready_bridge \
            tests.test_prelim_ready_recorded \
            tests.test_prelim_ready_authority \
            tests.test_prelim_integration_ready \
            tests.test_prelim_ready_recorded
