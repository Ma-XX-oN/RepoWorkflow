name: repo-ci GitHub full migration certification

on:
  pull_request:
    paths:
      - '.github/workflows/consumer-ci.yml'
      - '.github/workflows/repo-ci-github-full-certification.yml'
      - 'repo_workflow/repo_ci_dispatcher.py'
      - 'repo_workflow/repo_ci_github_provider.py'
      - 'tests/test_repo_ci_github_migration.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install required dependencies
        run: python -m pip install -r requirements.txt
      - name: Full authoritative regression, including consumer parity
        run: python scripts/validate.py
      - name: Require no working-tree mutations
        shell: bash
        run: test -z "$(git status --porcelain=v1 --untracked-files=all)"
